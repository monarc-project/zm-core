openapi: 3.0.3
info:
  title: MONARC Scenario API
  version: v1
  description: >-
    Versioned contract for the Scenario bounded domain. Scenario mutations and
    data endpoints are added incrementally; v1 includes the BackOffice Scenario
    Library catalog lifecycle.
servers:
  - url: /api/scenario/v1
security:
  - monarcToken: []
paths:
  /health:
    get:
      operationId: getScenarioHealth
      summary: Process liveness probe
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The Scenario API process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeStatus'
  /ready:
    get:
      operationId: getScenarioReadiness
      summary: Dependency readiness probe
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The Scenario API dependency is usable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeStatus'
        '503':
          description: A required dependency is not usable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeStatus'
  /anrs/{anrId}/criteria-profiles:
    get:
      operationId: listScenarioCriteriaProfiles
      summary: List authorised client-scoped criteria profile versions
      parameters: [{$ref: '#/components/parameters/AnrId'}]
      responses:
        '200':
          description: Criteria profile versions available to the Scenario analysis.
          content: {application/json: {schema: {$ref: '#/components/schemas/CriteriaProfileList'}}}
    post:
      operationId: createScenarioCriteriaProfileVersion
      summary: Create a new immutable criteria profile version
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CriteriaProfileWrite'}}}}
      responses:
        '200': {description: Immutable profile version, content: {application/json: {schema: {$ref: '#/components/schemas/CriteriaProfile'}}}}
        '409': {$ref: '#/components/responses/RevisionConflict'}
  /anrs/{anrId}/criteria-profiles/assigned:
    get:
      operationId: getAssignedScenarioCriteriaProfile
      summary: Get the immutable criteria-profile snapshot assigned to this Scenario analysis
      parameters: [{$ref: '#/components/parameters/AnrId'}]
      responses:
        '200': {description: Assigned profile snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/AssignedCriteriaProfile'}}}}
  /anrs/{anrId}/criteria-profiles/{profileVersionId}/assign:
    post:
      operationId: assignScenarioCriteriaProfile
      summary: Assign an immutable profile version to this Scenario analysis
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ProfileVersionId'}, {$ref: '#/components/parameters/IfMatch'}]
      responses:
        '200': {description: Assigned profile version, content: {application/json: {schema: {$ref: '#/components/schemas/CriteriaProfile'}}}}
        '409': {$ref: '#/components/responses/RevisionConflict'}
  /anrs/{anrId}/criteria-definition/source:
    get:
      operationId: getScenarioOperationalRiskCriteriaSource
      summary: Read the current authorised ANR operational-risk scales for explicit Scenario criteria derivation
      parameters: [{$ref: '#/components/parameters/AnrId'}]
      responses:
        '200': {description: Current operational-risk scale mapping or incomplete-source guidance, content: {application/json: {schema: {$ref: '#/components/schemas/OperationalRiskCriteriaSource'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /anrs/{anrId}/criteria-definition/draft:
    get:
      operationId: getScenarioCriteriaDefinition
      summary: Read the editable Scenario-only criteria draft or immutable lock evidence
      parameters: [{$ref: '#/components/parameters/AnrId'}]
      responses:
        '200': {description: Criteria definition state, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioCriteriaDefinition'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createScenarioCriteriaDraftFromOperationalScales
      summary: Explicitly derive a Scenario-only criteria draft from current operational-risk scales
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CriteriaDraftCreate'}}}}
      responses:
        '200': {description: Editable criteria draft, content: {application/json: {schema: {$ref: '#/components/schemas/CriteriaDraft'}}}}
        '409': {$ref: '#/components/responses/RevisionConflict'}
        '422': {description: The current operational-risk scales are incomplete for qualitative Scenario criteria.}
    patch:
      operationId: updateScenarioCriteriaDraft
      summary: Update Scenario-only derived criteria before Context Establishment is locked
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CriteriaDraftUpdate'}}}}
      responses:
        '200': {description: Updated criteria draft, content: {application/json: {schema: {$ref: '#/components/schemas/CriteriaDraft'}}}}
        '409': {$ref: '#/components/responses/RevisionConflict'}
  /anrs/{anrId}/criteria-definition/lock:
    post:
      operationId: lockScenarioCriteriaDefinition
      summary: Lock the Scenario criteria draft into an immutable assigned profile and source snapshot
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CriteriaDraftCreate'}}}}
      responses:
        '200': {description: Immutable criteria lock evidence, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioCriteriaLock'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/RevisionConflict'}
  /anrs/{anrId}/risk-scenarios/{scenarioId}/assessments:
    get:
      operationId: listScenarioAssessments
      summary: List immutable assessment snapshots for one authorised risk scenario
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}]
      responses:
        '200': {description: Assessment snapshots, content: {application/json: {schema: {$ref: '#/components/schemas/AssessmentList'}}}}
    post:
      operationId: saveScenarioAssessment
      summary: Save an explainable immutable assessment snapshot for one risk scenario
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssessmentWrite'}}}}
      responses:
        '200': {description: Assessment snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/Assessment'}}}}
        '409': {$ref: '#/components/responses/RevisionConflict'}
  /anrs/{anrId}/risk-scenarios/{scenarioId}/assessments/reduce:
    post:
      operationId: applyScenarioRiskReduction
      summary: Apply the latest proposed residual assessment as current risk after treatment completion
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/IfMatch'}]
      responses:
        '200': {description: New immutable current assessment, content: {application/json: {schema: {$ref: '#/components/schemas/Assessment'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/RevisionConflict'}
        '422': {description: A proposed residual assessment or terminal treatment-plan state is required.}
  /anrs/{anrId}/risk-scenarios/{scenarioId}/assessments/treatments:
    get:
      operationId: listScenarioTreatments
      summary: List treatments for one authorised risk scenario
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}]
      responses: {'200': {description: Treatment records, content: {application/json: {schema: {$ref: '#/components/schemas/TreatmentList'}}}}}
    post:
      operationId: createScenarioTreatment
      summary: Record a treatment action without implying acceptance
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TreatmentWrite'}}}}
      responses: {'200': {description: Treatment record, content: {application/json: {schema: {$ref: '#/components/schemas/Treatment'}}}}, '409': {$ref: '#/components/responses/RevisionConflict'}}
  /anrs/{anrId}/risk-scenarios/{scenarioId}/assessments/treatments/{treatmentId}:
    get:
      operationId: getScenarioTreatment
      summary: Read one authorised Scenario treatment plan and immutable recommendation guidance
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/TreatmentId'}]
      responses: {'200': {description: Treatment plan, content: {application/json: {schema: {$ref: '#/components/schemas/Treatment'}}}}, '404': {$ref: '#/components/responses/NotFound'}}
    patch:
      operationId: updateScenarioTreatment
      summary: Update a non-terminal Scenario treatment plan without changing an assessment or acceptance
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/TreatmentId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/ScenarioRevision'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TreatmentUpdate'}}}}
      responses: {'200': {description: Updated treatment plan, content: {application/json: {schema: {$ref: '#/components/schemas/Treatment'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/RevisionConflict'}, '422': {description: Invalid terminal transition or treatment update.}}
  /anrs/{anrId}/risk-scenarios/{scenarioId}/assessments/treatments/{treatmentId}/recommendations/{implementationId}:
    get:
      operationId: getScenarioTreatmentRecommendationImplementation
      summary: Read one selected recommendation implementation item in its authorised treatment plan
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/TreatmentId'}, {$ref: '#/components/parameters/ImplementationId'}]
      responses: {'200': {description: Recommendation implementation item, content: {application/json: {schema: {$ref: '#/components/schemas/TreatmentRecommendationImplementation'}}}}, '404': {$ref: '#/components/responses/NotFound'}}
    patch:
      operationId: updateScenarioTreatmentRecommendationImplementation
      summary: Track selected recommendation implementation without changing score, acceptance, or legacy risk state
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/TreatmentId'}, {$ref: '#/components/parameters/ImplementationId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/ScenarioRevision'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TreatmentRecommendationImplementationUpdate'}}}}
      responses: {'200': {description: Updated recommendation implementation item, content: {application/json: {schema: {$ref: '#/components/schemas/TreatmentRecommendationImplementation'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/RevisionConflict'}, '422': {description: Evidence or rationale is required for the selected implementation state.}}
  /anrs/{anrId}/risk-scenarios/{scenarioId}/assessments/treatments/{treatmentId}/history:
    get:
      operationId: listScenarioTreatmentHistory
      summary: Read append-only treatment and recommendation implementation history
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/TreatmentId'}]
      responses: {'200': {description: Treatment history, content: {application/json: {schema: {$ref: '#/components/schemas/TreatmentHistoryList'}}}}, '404': {$ref: '#/components/responses/NotFound'}}
  /anrs/{anrId}/treatment-owners:
    get:
      operationId: listScenarioTreatmentOwners
      summary: List users currently authorised for ownership in the authorised Scenario analysis
      parameters: [{$ref: '#/components/parameters/AnrId'}]
      responses: {'200': {description: Authorised owner choices, content: {application/json: {schema: {$ref: '#/components/schemas/TreatmentOwnerList'}}}}, '403': {$ref: '#/components/responses/Forbidden'}}
  /anrs/{anrId}/risk-scenarios/{scenarioId}/assessments/monitoring:
    get:
      operationId: listScenarioMonitoring
      summary: List monitoring observations for one authorised risk scenario
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}]
      responses: {'200': {description: Monitoring records, content: {application/json: {schema: {$ref: '#/components/schemas/MonitoringList'}}}}}
    post:
      operationId: createScenarioMonitoring
      summary: Record an indicator, trigger, and observation
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MonitoringWrite'}}}}
      responses: {'200': {description: Monitoring record, content: {application/json: {schema: {$ref: '#/components/schemas/Monitoring'}}}}, '409': {$ref: '#/components/responses/RevisionConflict'}}
  /anrs/{anrId}/risk-scenarios/{scenarioId}/assessments/acceptances:
    get:
      operationId: listScenarioAcceptances
      summary: List residual-risk acceptance decisions for one authorised risk scenario
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}]
      responses: {'200': {description: Acceptance decisions, content: {application/json: {schema: {$ref: '#/components/schemas/AcceptanceList'}}}}}
    post:
      operationId: acceptScenarioResidualRisk
      summary: Record a residual-risk acceptance by its assigned linked supervisor
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AcceptanceWrite'}}}}
      responses: {'200': {description: Acceptance decision, content: {application/json: {schema: {$ref: '#/components/schemas/Acceptance'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/RevisionConflict'}}
  /anrs/{anrId}/decision-authority/supervisors:
    get:
      operationId: listScenarioDecisionAuthoritySupervisors
      summary: List supervisors scoped to the authorised Scenario analysis
      parameters: [{$ref: '#/components/parameters/AnrId'}]
      responses: {'200': {description: Supervisor configuration, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioSupervisorList'}}}}, '403': {$ref: '#/components/responses/Forbidden'}}
    post:
      operationId: createScenarioResidualRiskApprover
      summary: Add an active residual-risk approver, linked or external
      parameters: [{$ref: '#/components/parameters/AnrId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioSupervisorWrite'}}}}
      responses: {'200': {description: Supervisor configuration, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioSupervisor'}}}}, '403': {$ref: '#/components/responses/Forbidden'}}
  /anrs/{anrId}/decision-authority/supervisors/{supervisorId}:
    patch:
      operationId: updateScenarioResidualRiskApprover
      summary: Update a linked or external supervisor and its active state
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/SupervisorId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioSupervisorWrite'}}}}
      responses: {'200': {description: Supervisor configuration, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioSupervisor'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /anrs/{anrId}/decision-authority/linkable-users:
    get:
      operationId: searchScenarioLinkableUsers
      summary: Search linkable local users when the current user may manage links
      parameters: [{$ref: '#/components/parameters/AnrId'}, {name: query, in: query, required: false, schema: {type: string, maxLength: 100}}]
      responses: {'200': {description: Linkable local users, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioLinkableUserList'}}}}, '403': {$ref: '#/components/responses/Forbidden'}}
  /anrs/{anrId}/decision-authority/users:
    post:
      operationId: createScenarioSupervisorUser
      summary: Create a local FrontOffice user for a Scenario supervisor
      parameters: [{$ref: '#/components/parameters/AnrId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioSupervisorUserWrite'}}}}
      responses: {'200': {description: Created local user, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioLinkableUser'}}}}, '403': {$ref: '#/components/responses/Forbidden'}}
  /auth/bridge/issue:
    post:
      operationId: issueScenarioLegacyHandoff
      summary: Issue a one-time legacy Scenario handoff
      description: Requires the existing MONARC token over the same origin. The token is never part of the request body or response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegacyHandoffIssueRequest'
      responses:
        '200':
          description: A short-lived one-time code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyHandoffIssueResponse'
        '401':
          $ref: '#/components/responses/InvalidHandoff'
  /auth/bridge/consume:
    post:
      operationId: consumeScenarioLegacyHandoff
      summary: Consume a one-time legacy handoff through the internal BFF channel
      security:
        - scenarioBridgeService: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegacyHandoffConsumeRequest'
      responses:
        '200':
          description: An opaque Scenario session; do not expose it outside the BFF.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioSession'
        '401':
          $ref: '#/components/responses/InvalidHandoff'
  /auth/session/resolve:
    post:
      operationId: resolveScenarioSession
      summary: Resolve and re-authorise an opaque Scenario session
      security:
        - scenarioBridgeService: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioSessionReference'
      responses:
        '200':
          description: The still-authorised session context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioSession'
        '401':
          $ref: '#/components/responses/InvalidHandoff'
  /auth/session/revoke:
    post:
      operationId: revokeScenarioSession
      summary: Revoke an opaque Scenario session
      security:
        - scenarioBridgeService: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioSessionReference'
      responses:
        '200':
          description: Revocation completed without revealing whether the session existed.
  /anrs/{anrId}/analysis:
    get:
      operationId: getScenarioAnalysis
      summary: Resume an authorised scenario-analysis draft or workspace
      parameters: [{$ref: '#/components/parameters/AnrId'}]
      responses:
        '200': {description: Scenario analysis metadata, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioAnalysis'}}}}
        '404': {description: No scenario metadata has been created for this authorised analysis.}
    post:
      operationId: createScenarioAnalysisMetadata
      summary: Initialise an incomplete authorised scenario-analysis draft
      parameters: [{$ref: '#/components/parameters/AnrId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioAnalysisCreate'}}}}
      responses:
        '200': {description: Draft metadata created, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioAnalysis'}}}}
        '409': {$ref: '#/components/responses/RevisionConflict'}
  /anrs/{anrId}/analysis/{id}:
    patch:
      operationId: updateScenarioAnalysisLifecycle
      summary: Update lifecycle or review metadata using optimistic concurrency
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioAnalysisUpdate'}}}}
      responses:
        '200': {description: Updated metadata, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioAnalysis'}}}}
        '409': {$ref: '#/components/responses/RevisionConflict'}
  /anrs/{anrId}/method-context/trends:
    get:
      operationId: listScenarioTrendQuestions
      summary: List trend questions available to the authorised Scenario ANR
      parameters: [{$ref: '#/components/parameters/AnrId'}]
      responses:
        '200': {description: Trend questions and current answers, content: {application/json: {schema: {$ref: '#/components/schemas/TrendQuestionPage'}}}}
    post:
      operationId: createScenarioTrendQuestion
      summary: Create an analysis-local free-text trend question
      parameters: [{$ref: '#/components/parameters/AnrId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TrendQuestionCreate'}}}}
      responses:
        '200': {description: Trend question created, content: {application/json: {schema: {$ref: '#/components/schemas/TrendQuestion'}}}}
        '422': {description: Invalid question.}
  /anrs/{anrId}/method-context/trends/{id}:
    patch:
      operationId: updateScenarioTrendQuestionResponse
      summary: Save one authorised Scenario trend-question answer
      parameters: [{$ref: '#/components/parameters/AnrId'}, {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TrendQuestionResponseWrite'}}}}
      responses:
        '200': {description: Updated trend question, content: {application/json: {schema: {$ref: '#/components/schemas/TrendQuestion'}}}}
        '422': {description: Invalid answer.}
  /anrs/{anrId}/method-context/reassessment:
    get:
      operationId: getScenarioReassessmentStrategy
      summary: Read the existing per-ANR reassessment strategy for the authorised Scenario analysis
      parameters: [{$ref: '#/components/parameters/AnrId'}]
      responses:
        '200': {description: Reassessment strategy, content: {application/json: {schema: {$ref: '#/components/schemas/ReassessmentStrategy'}}}}
    patch:
      operationId: updateScenarioReassessmentStrategy
      summary: Update the review date or cadence for the authorised Scenario analysis
      parameters: [{$ref: '#/components/parameters/AnrId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReassessmentStrategyWrite'}}}}
      responses:
        '200': {description: Updated reassessment strategy, content: {application/json: {schema: {$ref: '#/components/schemas/ReassessmentStrategy'}}}}
        '422': {description: Invalid reassessment strategy.}
  /anrs/{anrId}/method-context/reassessment-triggers:
    get:
      operationId: listScenarioReassessmentTriggers
      summary: List reassessment trigger criteria for the authorised Scenario analysis
      parameters: [{$ref: '#/components/parameters/AnrId'}]
      responses:
        '200': {description: Trigger criteria, content: {application/json: {schema: {$ref: '#/components/schemas/ReassessmentTriggerPage'}}}}
    post:
      operationId: createScenarioReassessmentTrigger
      summary: Add a reassessment trigger criterion to the authorised Scenario analysis
      parameters: [{$ref: '#/components/parameters/AnrId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReassessmentTriggerWrite'}}}}
      responses:
        '200': {description: Created trigger criterion, content: {application/json: {schema: {$ref: '#/components/schemas/ReassessmentTrigger'}}}}
        '422': {description: Invalid trigger criterion.}
  /anrs/{anrId}/method-context/reassessment-triggers/{id}:
    patch:
      operationId: updateScenarioReassessmentTrigger
      summary: Update an authorised Scenario reassessment trigger criterion
      parameters: [{$ref: '#/components/parameters/AnrId'}, {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReassessmentTriggerUpdate'}}}}
      responses: {'200': {description: Updated trigger criterion, content: {application/json: {schema: {$ref: '#/components/schemas/ReassessmentTrigger'}}}}}
    delete:
      operationId: deleteScenarioReassessmentTrigger
      summary: Remove an authorised Scenario reassessment trigger criterion
      parameters: [{$ref: '#/components/parameters/AnrId'}, {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}]
      responses: {'204': {description: Trigger criterion removed.}}
  /anrs/{anrId}/reviews/schedule:
    get:
      operationId: getScenarioReviewSchedule
      summary: Read the derived Scenario reassessment schedule and acceptance-decision guidance
      parameters: [{$ref: '#/components/parameters/AnrId'}]
      responses:
        '200': {description: Derived schedule state, active review cases, and decision-required indicators, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewScheduleSummary'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /anrs/{anrId}/reviews/cases:
    get:
      operationId: listScenarioReviewCases
      summary: List append-only evidence and current state for authorised review cases
      parameters: [{$ref: '#/components/parameters/AnrId'}]
      responses:
        '200': {description: Review cases, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewCaseList'}}}}
    post:
      operationId: createScenarioReviewCase
      summary: Initiate an idempotent scheduled or manual review case
      parameters: [{$ref: '#/components/parameters/AnrId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewCaseCreate'}}}}
      responses:
        '200': {description: Initiated review case, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewCase'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/RevisionConflict'}
        '422': {description: Schedule or scope does not permit the requested review.}
  /anrs/{anrId}/reviews/cases/{caseId}:
    get:
      operationId: getScenarioReviewCase
      summary: Read one review case in its authorised ANR scope
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/CaseId'}]
      responses:
        '200': {description: Review case, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewCase'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /anrs/{anrId}/reviews/cases/{caseId}/{action}:
    patch:
      operationId: transitionScenarioReviewCase
      summary: Assign, re-scope, record dispositions, complete, or dismiss an authorised review case
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/CaseId'}, {$ref: '#/components/parameters/ReviewAction'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewCaseTransition'}}}}
      responses:
        '200': {description: Updated review case, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewCase'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/RevisionConflict'}
        '422': {description: Invalid review state transition, scope, or evidence.}
  /anrs/{anrId}/reviews/occurrences:
    get:
      operationId: listScenarioTriggerOccurrences
      summary: List explicit reassessment trigger occurrences for the authorised Scenario analysis
      parameters: [{$ref: '#/components/parameters/AnrId'}]
      responses:
        '200': {description: Trigger occurrences, content: {application/json: {schema: {$ref: '#/components/schemas/TriggerOccurrenceList'}}}}
    post:
      operationId: createScenarioTriggerOccurrence
      summary: Record an explicit trigger occurrence and link it to a compatible review case
      parameters: [{$ref: '#/components/parameters/AnrId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TriggerOccurrenceWrite'}}}}
      responses:
        '200': {description: Trigger occurrence, content: {application/json: {schema: {$ref: '#/components/schemas/TriggerOccurrence'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {description: Invalid explicit trigger occurrence or review scope.}
  /anrs/{anrId}/risk-register:
    get:
      operationId: listScenarioRiskRegister
      summary: Read the authorised, criteria-version-aware Scenario risk register
      parameters:
        - {$ref: '#/components/parameters/AnrId'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {name: text, in: query, schema: {type: string, maxLength: 120}}
        - {name: lifecycle, in: query, schema: {type: string, enum: [draft, active, monitored, closed, archived]}}
        - {name: completeness, in: query, schema: {type: string, enum: [complete, incomplete]}}
        - {name: band, in: query, schema: {type: string, enum: [low, medium, high, critical]}}
        - {name: profileVersion, in: query, schema: {type: string, format: uuid}}
        - {name: treatmentState, in: query, schema: {type: string, enum: [absent, action_required, complete]}}
        - {name: reviewState, in: query, schema: {type: string, enum: [not_scheduled, upcoming, due, overdue, active]}}
        - {name: triggerOccurred, in: query, schema: {type: boolean}}
        - {name: acceptanceState, in: query, schema: {type: string, enum: [absent, current, decision_required, stale]}}
        - {name: subject, in: query, schema: {type: string, maxLength: 120}}
        - {name: sort, in: query, schema: {type: string, enum: [title, updatedAt, lifecycle], default: updatedAt}}
        - {name: direction, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
      responses:
        '200': {description: Paginated compact current-evidence projection, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioRiskRegisterPage'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {description: Invalid register query.}
  /anrs/{anrId}/risk-scenarios:
    get:
      operationId: listScenarioRiskScenarios
      summary: List editable risk scenarios in stable creation order
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {description: Paginated authorised risk scenarios, content: {application/json: {schema: {$ref: '#/components/schemas/RiskScenarioPage'}}}}
        '403': {description: Scenario capability or ANR access is unavailable.}
    post:
      operationId: createScenarioRiskScenario
      summary: Create an incomplete editable risk scenario
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/CorrelationId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RiskScenarioWrite'}}}}
      responses:
        '200': {description: Risk scenario created, content: {application/json: {schema: {$ref: '#/components/schemas/RiskScenario'}}}}
        '422': {description: The risk-scenario payload is invalid.}
  /anrs/{anrId}/risk-scenario-references:
    get:
      operationId: listScenarioRiskScenarioReferences
      summary: List a bounded, authorised projection for a risk-scenario picker
      parameters:
        - $ref: '#/components/parameters/AnrId'
        - name: kind
          in: query
          required: true
          schema: {type: string, enum: [asset, asset-type, threat, vulnerability, control, recommendation-set, recommendation, risk-source]}
        - name: query
          in: query
          schema: {type: string, maxLength: 100}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': {description: Authorised reference candidates, content: {application/json: {schema: {$ref: '#/components/schemas/RiskScenarioReferencePage'}}}}
        '403': {description: Scenario capability or ANR access is unavailable.}
        '422': {description: The reference kind is invalid.}
    post:
      operationId: createScenarioContextualRiskSource
      summary: Create the one supported minimal local contextual reference
      parameters: [{$ref: '#/components/parameters/AnrId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ContextualRiskSourceWrite'}}}}
      responses:
        '200': {description: Local risk source created, content: {application/json: {schema: {$ref: '#/components/schemas/RiskScenarioReference'}}}}
        '403': {description: Scenario capability or ANR access is unavailable.}
        '422': {description: The contextual reference payload is invalid.}
  /anrs/{anrId}/interested-party-references:
    get:
      operationId: listScenarioInterestedPartyReferences
      summary: List authorised analysis-level interested parties and Scenario link status
      parameters:
        - $ref: '#/components/parameters/AnrId'
        - name: query
          in: query
          schema: {type: string, maxLength: 100}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': {description: Interested-party references, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioInterestedPartyReferencePage'}}}}
        '403': {description: Scenario capability or ANR access is unavailable.}
    post:
      operationId: attachScenarioInterestedPartyReference
      parameters:
        - $ref: '#/components/parameters/AnrId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioInterestedPartyReferenceWrite'}}}}
      responses:
        '200': {description: Scenario interested-party snapshot attached, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioInterestedPartyReference'}}}}
        '409': {description: Analysis revision conflict.}
  /anrs/{anrId}/interested-party-references/{id}:
    delete:
      operationId: detachScenarioInterestedPartyReference
      parameters:
        - $ref: '#/components/parameters/AnrId'
        - $ref: '#/components/parameters/IfMatch'
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: Scenario interested-party snapshot detached.}
        '409': {description: Analysis revision conflict.}
  /anrs/{anrId}/risk-scenarios/{id}:
    get:
      operationId: getScenarioRiskScenario
      summary: Read one editable risk scenario
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}]
      responses:
        '200': {description: Authorised risk scenario, content: {application/json: {schema: {$ref: '#/components/schemas/RiskScenario'}}}}
        '404': {description: Risk scenario was not found in the authorised ANR.}
    patch:
      operationId: updateScenarioRiskScenario
      summary: Update an editable risk scenario using optimistic concurrency
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/CorrelationId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RiskScenarioUpdate'}}}}
      responses:
        '200': {description: Updated risk scenario, content: {application/json: {schema: {$ref: '#/components/schemas/RiskScenario'}}}}
        '409': {$ref: '#/components/responses/RevisionConflict'}
        '422': {description: The risk-scenario payload is invalid.}
    delete:
      operationId: deleteScenarioRiskScenario
      summary: Delete an editable risk scenario using optimistic concurrency
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/CorrelationId'}]
      responses:
        '204': {description: Risk scenario deleted.}
        '409': {$ref: '#/components/responses/RevisionConflict'}
        '404': {description: Risk scenario was not found in the authorised ANR.}
  /anrs/{anrId}/risk-scenarios/{id}/risk-source:
    get:
      operationId: getScenarioRiskSource
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}]
      responses: {'200': {description: Local risk source, content: {application/json: {schema: {$ref: '#/components/schemas/RiskScenarioRecord'}}}}}
    post:
      operationId: saveScenarioRiskSource
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RiskSourceWrite'}}}}
      responses: {'200': {description: Risk source saved}, '409': {$ref: '#/components/responses/RevisionConflict'}}
    patch:
      operationId: updateScenarioRiskSource
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RiskSourceUpdate'}}}}
      responses: {'200': {description: Risk source updated}, '409': {$ref: '#/components/responses/RevisionConflict'}}
  /anrs/{anrId}/risk-scenarios/{id}/cause:
    get:
