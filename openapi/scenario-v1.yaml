        languageCode: {type: string}
        readAt: {type: string, format: date-time}
        levels: {type: array, items: {$ref: '#/components/schemas/ScenarioCriteriaSourceLevel'}}
    ScenarioCriteriaDefinition:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [empty, draft, locked]}
        draft: {$ref: '#/components/schemas/CriteriaDraft'}
        locked: {$ref: '#/components/schemas/ScenarioCriteriaLock'}
    AssessmentWrite:
      type: object
      required: [assessmentType, profileVersionUuid, likelihood, dimensionSeverities, justification]
      properties:
        assessmentType: {type: string, enum: [inherent, current, proposed_residual]}
        profileVersionUuid: {type: string, format: uuid}
        likelihood: {type: integer, minimum: 0, maximum: 255}
        dimensionSeverities: {type: object, additionalProperties: {type: integer, minimum: 0, maximum: 255}}
        controlReferences: {type: array, items: {type: string, format: uuid}}
        evidenceReferences: {type: array, items: {type: string, format: uuid}}
        justification: {type: string, minLength: 1, description: Written assessment justification.}
        legacyComparison: {type: object, nullable: true, description: Labelled comparison evidence only; never a Scenario score.}
    Assessment:
      type: object
      required: [uuid, assessmentType, revision, calculation]
      properties:
        uuid: {type: string, format: uuid}
        assessmentType: {type: string}
        revision: {type: integer, minimum: 1}
        calculation: {type: object, description: Immutable explainable calculation snapshot.}
        legacyComparison: {type: object, nullable: true, description: Labelled legacy comparison evidence only.}
        supersedesUuid: {type: string, format: uuid, nullable: true}
        performedBy:
          type: object
          description: User identity resolved for the recorded immutable assessment action.
          required: [name]
          properties:
            name: {type: string}
            email: {type: string, format: email, nullable: true}
    AssessmentList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Assessment'}}
    TreatmentWrite:
      type: object
      additionalProperties: false
      required: [treatmentType, actionText, status]
      properties:
        treatmentType: {type: string, enum: [avoid, modify, share, retain]}
        actionText: {type: string, minLength: 1}
        ownerId: {type: integer, minimum: 1, nullable: true}
        dueAt: {type: string, format: date-time, nullable: true}
        status: {type: string, enum: [planned, in_progress, completed, cancelled]}
        recommendationReferences:
          type: array
          description: Legacy shorthand for current-analysis recommendations selected as immutable treatment guidance. New clients should use recommendationSelections to record treatment-specific priority.
          uniqueItems: true
          items: {type: string, format: uuid}
        recommendationSelections:
          type: array
          description: Current-analysis recommendations selected as immutable treatment guidance, with treatment-specific importance. This does not modify the Knowledge Base recommendation importance.
          items:
            type: object
            additionalProperties: false
            required: [recommendationUuid, treatmentImportance]
            properties:
              recommendationUuid: {type: string, format: uuid}
              treatmentImportance: {type: integer, minimum: 0, maximum: 3, description: Treatment-plan priority; 0 means not set.}
        completionEvidence: {type: string, nullable: true, description: Required when a recommendation-free treatment is completed.}
        cancellationRationale: {type: string, nullable: true, description: Required when a treatment is cancelled.}
    TreatmentUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        treatmentType: {type: string, enum: [avoid, modify, share, retain]}
        actionText: {type: string, minLength: 1}
        ownerId: {type: integer, minimum: 1, nullable: true}
        dueAt: {type: string, format: date-time, nullable: true}
        status: {type: string, enum: [planned, in_progress, completed, cancelled]}
        completionEvidence: {type: string, nullable: true}
        cancellationRationale: {type: string, nullable: true}
    TreatmentOwner:
      type: object
      required: [id, name, email]
      properties:
        id: {type: integer, minimum: 1}
        name: {type: string}
        email: {type: string, format: email}
    TreatmentOwnerList:
      type: object
      required: [items, canEdit]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/TreatmentOwner'}}
        canEdit: {type: boolean, description: Informative UI capability only; the backend remains authoritative.}
    TreatmentRecommendationImplementationUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status: {type: string, enum: [not_started, in_progress, implemented, not_applicable]}
        ownerId: {type: integer, minimum: 1, nullable: true}
        targetAt: {type: string, format: date-time, nullable: true}
        workingNote: {type: string, nullable: true}
        completionEvidence: {type: string, nullable: true, description: Required for implemented status.}
        notApplicableRationale: {type: string, nullable: true, description: Required for not-applicable status.}
    TreatmentRecommendationImplementation:
      allOf:
        - {$ref: '#/components/schemas/TreatmentRecommendationImplementationUpdate'}
        - type: object
          required: [uuid, revision, recommendationUuid, code, description, recommendationSetLabel, status]
          properties:
            uuid: {type: string, format: uuid}
            revision: {type: integer, minimum: 1}
            recommendationUuid: {type: string, format: uuid}
            code: {type: string}
            description: {type: string}
            importance: {type: integer, minimum: 0, maximum: 3, description: Immutable source recommendation importance; 0 means not set.}
            position: {type: integer, minimum: 0, description: Immutable source recommendation plan position; 0 means not set.}
            treatmentImportance: {type: integer, minimum: 0, maximum: 3, description: Immutable treatment-plan priority selected when this recommendation was added; 0 means not set.}
            recommendationSetUuid: {type: string, format: uuid, nullable: true}
            recommendationSetLabel: {type: string}
            owner: {$ref: '#/components/schemas/TreatmentOwner', nullable: true}
            implementedBy: {type: integer, minimum: 1, nullable: true}
            implementedAt: {type: string, format: date-time, nullable: true}
    TreatmentHistoryEntry:
      type: object
      required: [uuid, action, actor, after, createdAt]
      properties:
        uuid: {type: string, format: uuid}
        action: {type: string}
        implementationUuid: {type: string, format: uuid, nullable: true}
        recommendation: {type: object, nullable: true}
        actor: {type: object, required: [name], properties: {name: {type: string}, email: {type: string, format: email, nullable: true}}}
        owner: {type: object, nullable: true}
        before: {type: object, nullable: true}
        after: {type: object}
        createdAt: {type: string, format: date-time}
    TreatmentHistoryList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/TreatmentHistoryEntry'}}}
    Treatment:
      allOf:
        - {$ref: '#/components/schemas/TreatmentWrite'}
        - type: object
          required: [uuid, revision, recommendations]
          properties:
            uuid: {type: string, format: uuid}
            revision: {type: integer, minimum: 1}
            owner: {$ref: '#/components/schemas/TreatmentOwner', nullable: true}
            recommendations: {type: array, items: {$ref: '#/components/schemas/TreatmentRecommendationImplementation'}}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
    TreatmentList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/Treatment'}}}
    MonitoringWrite:
      type: object
      required: [indicator, reassessmentTriggerId]
      properties:
        indicator: {type: string, minLength: 1, maxLength: 255}
        reassessmentTriggerId: {type: integer, minimum: 1, description: Active Context Establishment reassessment trigger ID}
        observation: {type: string, nullable: true}
    Monitoring:
      allOf:
        - {$ref: '#/components/schemas/MonitoringWrite'}
        - type: object
          required: [uuid, revision]
          properties:
            uuid: {type: string, format: uuid}
            revision: {type: integer, minimum: 1}
            reassessmentTrigger: {type: string, description: Immutable trigger label snapshot at monitoring-record time}
            reassessmentTriggerId: {type: integer, nullable: true, description: Linked Context Establishment reassessment trigger ID}
    MonitoringList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/Monitoring'}}}
    AcceptanceWrite:
      type: object
      required: [assessmentUuid, assignedSupervisorId, decision, reason]
      properties:
        assessmentUuid: {type: string, format: uuid}
        assignedSupervisorId: {type: integer, minimum: 1}
        decision: {type: string, enum: [accepted, not_accepted]}
        reason: {type: string, minLength: 1}
    Acceptance:
      type: object
      required: [uuid, assignedSupervisorId, revision, decision]
      properties:
        uuid: {type: string, format: uuid}
        assignedSupervisorId: {type: integer, minimum: 1}
        revision: {type: integer, minimum: 1}
        decision: {type: object}
    AcceptanceList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/Acceptance'}}}
    ScenarioSupervisorWrite:
      type: object
      required: [isActive]
      additionalProperties: false
      properties:
        linkedUserId: {type: integer, minimum: 1, nullable: true}
        name: {type: string, maxLength: 255}
        email: {type: string, format: email}
        rolePosition: {type: string, maxLength: 255}
        roles: {type: array, items: {type: string}}
        isActive: {type: boolean}
    ScenarioSupervisor:
      type: object
      required: [id, name, roles, isActive]
      properties:
        id: {type: integer, minimum: 1}
        linkedUserId: {type: integer, minimum: 1, nullable: true}
        name: {type: string}
        email: {type: string, format: email}
        roles: {type: array, items: {type: string}}
        isActive: {type: boolean}
    ScenarioSupervisorList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ScenarioSupervisor'}}
        canManage: {type: boolean}
        canCreateUsers: {type: boolean}
    ScenarioLinkableUser:
      type: object
      required: [id, firstname, lastname, email]
      properties:
        id: {type: integer, minimum: 1}
        firstname: {type: string}
        lastname: {type: string}
        email: {type: string, format: email}
    ScenarioSupervisorUserWrite:
      type: object
      required: [firstname, lastname, email]
      additionalProperties: false
      properties:
        firstname: {type: string, minLength: 1, maxLength: 100}
        lastname: {type: string, minLength: 1, maxLength: 100}
        email: {type: string, format: email}
    ScenarioLinkableUserList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/ScenarioLinkableUser'}}}
    ScenarioRiskRegisterRow:
      type: object
      required: [uuid, title, lifecycle, completeness, context, evaluations, treatment, review, acceptance, updatedAt]
      properties:
        uuid: {type: string, format: uuid}
        title: {type: string}
        narrative: {type: string, nullable: true}
        lifecycle: {type: string}
        completeness: {type: string, enum: [complete, incomplete]}
        context: {type: object, description: Current risk-source, event, consequence and affected-subject context.}
        evaluations: {type: object, description: Current qualitative evidence and its criteria-profile version; never a cross-version ranking.}
        treatment: {type: object}
        review: {type: object}
        acceptance: {type: object}
        updatedAt: {type: string, format: date-time}
    ScenarioRiskRegisterPage:
      type: object
      required: [items, total, page, pageSize, appliedFilters, supported, summary]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ScenarioRiskRegisterRow'}}
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1, maximum: 100}
        appliedFilters: {type: object}
        supported: {type: object}
        summary: {$ref: '#/components/schemas/ScenarioRiskRegisterSummary'}
    ScenarioRiskRegisterSummary:
      type: object
      required: [total, treatmentActionRequired, activeReview, dueReview, overdueReview, decisionRequired, bandLow, bandMedium, bandHigh, bandCritical, noCurrentAssessment]
      properties:
        total: {type: integer, minimum: 0}
        treatmentActionRequired: {type: integer, minimum: 0}
        activeReview: {type: integer, minimum: 0}
        dueReview: {type: integer, minimum: 0}
        overdueReview: {type: integer, minimum: 0}
        decisionRequired: {type: integer, minimum: 0}
        bandLow: {type: integer, minimum: 0}
        bandMedium: {type: integer, minimum: 0}
        bandHigh: {type: integer, minimum: 0}
        bandCritical: {type: integer, minimum: 0}
        noCurrentAssessment: {type: integer, minimum: 0, description: Risk scenarios with no current assessment evidence.}
