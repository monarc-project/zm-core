openapi: 3.0.3
info:
  title: MONARC Scenario API
  version: v1
  description: >-
    Versioned contract for the Scenario bounded domain. Scenario mutations and
    data endpoints are added incrementally; v1 includes the BackOffice Scenario
    Library catalog lifecycle.
servers:
  - url: /api/scenario/v1
security:
  - monarcToken: []
paths:
  /health:
    get:
      operationId: getScenarioHealth
      summary: Process liveness probe
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The Scenario API process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeStatus'
  /ready:
    get:
      operationId: getScenarioReadiness
      summary: Dependency readiness probe
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The Scenario API dependency is usable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeStatus'
        '503':
          description: A required dependency is not usable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeStatus'
  /anrs/{anrId}/criteria-profiles:
    get:
      operationId: listScenarioCriteriaProfiles
      summary: List authorised client-scoped criteria profile versions
      parameters: [{$ref: '#/components/parameters/AnrId'}]
      responses:
        '200':
          description: Criteria profile versions available to the Scenario analysis.
          content: {application/json: {schema: {$ref: '#/components/schemas/CriteriaProfileList'}}}
    post:
      operationId: createScenarioCriteriaProfileVersion
      summary: Create a new immutable criteria profile version
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CriteriaProfileWrite'}}}}
      responses:
        '200': {description: Immutable profile version, content: {application/json: {schema: {$ref: '#/components/schemas/CriteriaProfile'}}}}
        '409': {$ref: '#/components/responses/RevisionConflict'}
  /anrs/{anrId}/criteria-profiles/assigned:
    get:
      operationId: getAssignedScenarioCriteriaProfile
      summary: Get the immutable criteria-profile snapshot assigned to this Scenario analysis
      parameters: [{$ref: '#/components/parameters/AnrId'}]
      responses:
        '200': {description: Assigned profile snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/AssignedCriteriaProfile'}}}}
  /anrs/{anrId}/criteria-profiles/{profileVersionId}/assign:
    post:
      operationId: assignScenarioCriteriaProfile
      summary: Assign an immutable profile version to this Scenario analysis
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ProfileVersionId'}, {$ref: '#/components/parameters/IfMatch'}]
      responses:
        '200': {description: Assigned profile version, content: {application/json: {schema: {$ref: '#/components/schemas/CriteriaProfile'}}}}
        '409': {$ref: '#/components/responses/RevisionConflict'}
  /anrs/{anrId}/risk-scenarios/{scenarioId}/assessments:
    get:
      operationId: listScenarioAssessments
      summary: List immutable assessment snapshots for one authorised risk story
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}]
      responses:
        '200': {description: Assessment snapshots, content: {application/json: {schema: {$ref: '#/components/schemas/AssessmentList'}}}}
    post:
      operationId: saveScenarioAssessment
      summary: Save an explainable immutable assessment snapshot for one risk story
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssessmentWrite'}}}}
      responses:
        '200': {description: Assessment snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/Assessment'}}}}
        '409': {$ref: '#/components/responses/RevisionConflict'}
  /anrs/{anrId}/risk-scenarios/{scenarioId}/assessments/treatments:
    get:
      operationId: listScenarioTreatments
      summary: List treatments for one authorised risk story
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}]
      responses: {'200': {description: Treatment records, content: {application/json: {schema: {$ref: '#/components/schemas/TreatmentList'}}}}}
    post:
      operationId: createScenarioTreatment
      summary: Record a treatment action without implying acceptance
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TreatmentWrite'}}}}
      responses: {'200': {description: Treatment record, content: {application/json: {schema: {$ref: '#/components/schemas/Treatment'}}}}, '409': {$ref: '#/components/responses/RevisionConflict'}}
  /anrs/{anrId}/risk-scenarios/{scenarioId}/assessments/monitoring:
    get:
      operationId: listScenarioMonitoring
      summary: List monitoring observations for one authorised risk story
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}]
      responses: {'200': {description: Monitoring records, content: {application/json: {schema: {$ref: '#/components/schemas/MonitoringList'}}}}}
    post:
      operationId: createScenarioMonitoring
      summary: Record an indicator, trigger, and observation
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MonitoringWrite'}}}}
      responses: {'200': {description: Monitoring record, content: {application/json: {schema: {$ref: '#/components/schemas/Monitoring'}}}}, '409': {$ref: '#/components/responses/RevisionConflict'}}
  /anrs/{anrId}/risk-scenarios/{scenarioId}/assessments/acceptances:
    get:
      operationId: listScenarioAcceptances
      summary: List residual-risk acceptance decisions for one authorised risk story
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}]
      responses: {'200': {description: Acceptance decisions, content: {application/json: {schema: {$ref: '#/components/schemas/AcceptanceList'}}}}}
    post:
      operationId: acceptScenarioResidualRisk
      summary: Record a residual-risk acceptance by its assigned linked supervisor
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AcceptanceWrite'}}}}
      responses: {'200': {description: Acceptance decision, content: {application/json: {schema: {$ref: '#/components/schemas/Acceptance'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/RevisionConflict'}}
  /anrs/{anrId}/decision-authority/supervisors:
    get:
      operationId: listScenarioDecisionAuthoritySupervisors
      summary: List supervisors scoped to the authorised Scenario analysis
      parameters: [{$ref: '#/components/parameters/AnrId'}]
      responses: {'200': {description: Supervisor configuration, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioSupervisorList'}}}}, '403': {$ref: '#/components/responses/Forbidden'}}
    post:
      operationId: createScenarioResidualRiskApprover
      summary: Link a local user as an active residual-risk approver
      parameters: [{$ref: '#/components/parameters/AnrId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioSupervisorWrite'}}}}
      responses: {'200': {description: Supervisor configuration, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioSupervisor'}}}}, '403': {$ref: '#/components/responses/Forbidden'}}
  /anrs/{anrId}/decision-authority/supervisors/{supervisorId}:
    patch:
      operationId: updateScenarioResidualRiskApprover
      summary: Update the linked local user or active state of a residual-risk approver
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/SupervisorId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioSupervisorWrite'}}}}
      responses: {'200': {description: Supervisor configuration, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioSupervisor'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /anrs/{anrId}/decision-authority/linkable-users:
    get:
      operationId: searchScenarioLinkableUsers
      summary: Search linkable local users when the current user may manage links
      parameters: [{$ref: '#/components/parameters/AnrId'}, {name: query, in: query, required: false, schema: {type: string, maxLength: 100}}]
      responses: {'200': {description: Linkable local users, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioLinkableUserList'}}}}, '403': {$ref: '#/components/responses/Forbidden'}}
  /auth/bridge/issue:
    post:
      operationId: issueScenarioLegacyHandoff
      summary: Issue a one-time legacy Scenario handoff
      description: Requires the existing MONARC token over the same origin. The token is never part of the request body or response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegacyHandoffIssueRequest'
      responses:
        '200':
          description: A short-lived one-time code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyHandoffIssueResponse'
        '401':
          $ref: '#/components/responses/InvalidHandoff'
  /auth/bridge/consume:
    post:
      operationId: consumeScenarioLegacyHandoff
      summary: Consume a one-time legacy handoff through the internal BFF channel
      security:
        - scenarioBridgeService: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegacyHandoffConsumeRequest'
      responses:
        '200':
          description: An opaque Scenario session; do not expose it outside the BFF.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioSession'
        '401':
          $ref: '#/components/responses/InvalidHandoff'
  /auth/session/resolve:
    post:
      operationId: resolveScenarioSession
      summary: Resolve and re-authorise an opaque Scenario session
      security:
        - scenarioBridgeService: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioSessionReference'
      responses:
        '200':
          description: The still-authorised session context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioSession'
        '401':
          $ref: '#/components/responses/InvalidHandoff'
  /auth/session/revoke:
    post:
      operationId: revokeScenarioSession
      summary: Revoke an opaque Scenario session
      security:
        - scenarioBridgeService: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioSessionReference'
      responses:
        '200':
          description: Revocation completed without revealing whether the session existed.
  /anrs/{anrId}/analysis:
    get:
      operationId: getScenarioAnalysis
      summary: Resume an authorised scenario-analysis draft or workspace
      parameters: [{$ref: '#/components/parameters/AnrId'}]
      responses:
        '200': {description: Scenario analysis metadata, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioAnalysis'}}}}
        '404': {description: No scenario metadata has been created for this authorised analysis.}
    post:
      operationId: createScenarioAnalysisMetadata
      summary: Initialise an incomplete authorised scenario-analysis draft
      parameters: [{$ref: '#/components/parameters/AnrId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioAnalysisCreate'}}}}
      responses:
        '200': {description: Draft metadata created, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioAnalysis'}}}}
        '409': {$ref: '#/components/responses/RevisionConflict'}
  /anrs/{anrId}/analysis/{id}:
    patch:
      operationId: updateScenarioAnalysisLifecycle
      summary: Update lifecycle or review metadata using optimistic concurrency
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioAnalysisUpdate'}}}}
      responses:
        '200': {description: Updated metadata, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioAnalysis'}}}}
        '409': {$ref: '#/components/responses/RevisionConflict'}
  /anrs/{anrId}/risk-scenarios:
    get:
      operationId: listScenarioRiskScenarios
      summary: List editable risk stories in stable creation order
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {description: Paginated authorised risk stories, content: {application/json: {schema: {$ref: '#/components/schemas/RiskScenarioPage'}}}}
        '403': {description: Scenario capability or ANR access is unavailable.}
    post:
      operationId: createScenarioRiskScenario
      summary: Create an incomplete editable risk story
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/CorrelationId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RiskScenarioWrite'}}}}
      responses:
        '200': {description: Risk story created, content: {application/json: {schema: {$ref: '#/components/schemas/RiskScenario'}}}}
        '422': {description: The risk-story payload is invalid.}
  /anrs/{anrId}/risk-story-references:
    get:
      operationId: listScenarioRiskStoryReferences
      summary: List a bounded, authorised projection for a risk-story picker
      parameters:
        - $ref: '#/components/parameters/AnrId'
        - name: kind
          in: query
          required: true
          schema: {type: string, enum: [risk-source, threat, vulnerability, asset, process, object, information, supplier, objective, control]}
        - name: query
          in: query
          schema: {type: string, maxLength: 100}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': {description: Authorised reference candidates, content: {application/json: {schema: {$ref: '#/components/schemas/RiskStoryReferencePage'}}}}
        '403': {description: Scenario capability or ANR access is unavailable.}
        '422': {description: The reference kind is invalid.}
  /anrs/{anrId}/risk-scenarios/{id}:
    get:
      operationId: getScenarioRiskScenario
      summary: Read one editable risk story
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}]
      responses:
        '200': {description: Authorised risk story, content: {application/json: {schema: {$ref: '#/components/schemas/RiskScenario'}}}}
        '404': {description: Risk story was not found in the authorised ANR.}
    patch:
      operationId: updateScenarioRiskScenario
      summary: Update an editable risk story using optimistic concurrency
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/CorrelationId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RiskScenarioUpdate'}}}}
      responses:
        '200': {description: Updated risk story, content: {application/json: {schema: {$ref: '#/components/schemas/RiskScenario'}}}}
        '409': {$ref: '#/components/responses/RevisionConflict'}
        '422': {description: The risk-story payload is invalid.}
    delete:
      operationId: deleteScenarioRiskScenario
      summary: Delete an editable risk story using optimistic concurrency
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/CorrelationId'}]
      responses:
        '204': {description: Risk story deleted.}
        '409': {$ref: '#/components/responses/RevisionConflict'}
        '404': {description: Risk story was not found in the authorised ANR.}
  /anrs/{anrId}/risk-scenarios/{id}/risk-source:
    get:
      operationId: getScenarioRiskSource
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}]
      responses: {'200': {description: Local risk source, content: {application/json: {schema: {$ref: '#/components/schemas/RiskStoryRecord'}}}}}
    post:
      operationId: saveScenarioRiskSource
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RiskSourceWrite'}}}}
      responses: {'200': {description: Risk source saved}, '409': {$ref: '#/components/responses/RevisionConflict'}}
    patch:
      operationId: updateScenarioRiskSource
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RiskSourceUpdate'}}}}
      responses: {'200': {description: Risk source updated}, '409': {$ref: '#/components/responses/RevisionConflict'}}
  /anrs/{anrId}/risk-scenarios/{id}/cause:
    get:
      operationId: getScenarioCause
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}]
      responses: {'200': {description: Local cause, content: {application/json: {schema: {$ref: '#/components/schemas/RiskStoryRecord'}}}}}
    post:
      operationId: saveScenarioCause
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CauseWrite'}}}}
      responses: {'200': {description: Cause saved}, '409': {$ref: '#/components/responses/RevisionConflict'}}
    patch:
      operationId: updateScenarioCause
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CauseUpdate'}}}}
      responses: {'200': {description: Cause updated}, '409': {$ref: '#/components/responses/RevisionConflict'}}
  /anrs/{anrId}/risk-scenarios/{id}/events:
    get:
      operationId: listScenarioEvents
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}]
      responses: {'200': {description: Events in the risk story, content: {application/json: {schema: {$ref: '#/components/schemas/RiskStoryNodePage'}}}}}
    post:
      operationId: createScenarioEvent
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RiskStoryNodeWrite'}}}}
      responses: {'200': {description: Event created}, '409': {$ref: '#/components/responses/RevisionConflict'}}
  /anrs/{anrId}/risk-scenarios/{id}/events/{resourceId}:
    patch:
      operationId: updateScenarioEvent
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/ResourceId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RiskStoryNodeUpdate'}}}}
      responses: {'200': {description: Event updated}, '409': {$ref: '#/components/responses/RevisionConflict'}}
    delete:
      operationId: deleteScenarioEvent
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/ResourceId'}, {$ref: '#/components/parameters/IfMatch'}]
      responses: {'204': {description: Event and dependent graph relations removed}, '409': {$ref: '#/components/responses/RevisionConflict'}}
  /anrs/{anrId}/risk-scenarios/{id}/consequences:
    get:
      operationId: listScenarioConsequences
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}]
      responses: {'200': {description: Consequences in the risk story, content: {application/json: {schema: {$ref: '#/components/schemas/RiskStoryNodePage'}}}}}
    post:
      operationId: createScenarioConsequence
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RiskStoryNodeWrite'}}}}
      responses: {'200': {description: Consequence created}, '409': {$ref: '#/components/responses/RevisionConflict'}}
  /anrs/{anrId}/risk-scenarios/{id}/consequences/{resourceId}:
    patch:
      operationId: updateScenarioConsequence
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/ResourceId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RiskStoryNodeUpdate'}}}}
      responses: {'200': {description: Consequence updated}, '409': {$ref: '#/components/responses/RevisionConflict'}}
    delete:
      operationId: deleteScenarioConsequence
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/ResourceId'}, {$ref: '#/components/parameters/IfMatch'}]
      responses: {'204': {description: Consequence and dependent relations removed}, '409': {$ref: '#/components/responses/RevisionConflict'}}
  /anrs/{anrId}/risk-scenarios/{id}/edges:
    get:
      operationId: listScenarioEventEdges
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}]
      responses: {'200': {description: Directed event edges, content: {application/json: {schema: {$ref: '#/components/schemas/RiskStoryRelationPage'}}}}}
    post:
      operationId: createScenarioEventEdge
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EventEdgeWrite'}}}}
      responses: {'200': {description: Event edge created}, '409': {$ref: '#/components/responses/RevisionConflict'}}
  /anrs/{anrId}/risk-scenarios/{id}/event-consequences:
    get:
      operationId: listScenarioEventConsequences
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}]
      responses: {'200': {description: Event-to-consequence relations, content: {application/json: {schema: {$ref: '#/components/schemas/RiskStoryRelationPage'}}}}}
    post:
      operationId: createScenarioEventConsequence
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EventConsequenceWrite'}}}}
      responses: {'200': {description: Event-to-consequence relation created}, '409': {$ref: '#/components/responses/RevisionConflict'}}
  /anrs/{anrId}/risk-scenarios/{id}/{relationResource}/{resourceId}:
    delete:
      operationId: deleteScenarioRelation
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/RelationResource'}, {$ref: '#/components/parameters/ResourceId'}, {$ref: '#/components/parameters/IfMatch'}]
      responses: {'204': {description: Relation deleted}, '409': {$ref: '#/components/responses/RevisionConflict'}}
  /anrs/{anrId}/risk-scenarios/{id}/subject-links:
    get:
      operationId: listScenarioSubjectLinks
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}]
      responses: {'200': {description: Subject links, content: {application/json: {schema: {$ref: '#/components/schemas/RiskStoryRelationPage'}}}}}
    post:
      operationId: createScenarioSubjectLink
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SubjectLinkWrite'}}}}
      responses: {'200': {description: Subject link created}, '403': {description: Referenced subject is unavailable}, '409': {$ref: '#/components/responses/RevisionConflict'}}
  /anrs/{anrId}/risk-scenarios/{id}/control-links:
    get:
      operationId: listScenarioControlLinks
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}]
      responses: {'200': {description: Control links, content: {application/json: {schema: {$ref: '#/components/schemas/RiskStoryRelationPage'}}}}}
    post:
      operationId: createScenarioControlLink
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ControlLinkWrite'}}}}
      responses: {'200': {description: Control link created}, '403': {description: Referenced control is unavailable}, '409': {$ref: '#/components/responses/RevisionConflict'}}
  /anrs/{anrId}/risk-scenarios/{id}/completeness:
    get:
      operationId: getScenarioRiskStoryCompleteness
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}]
      responses: {'200': {description: SRA-11 completeness report, content: {application/json: {schema: {$ref: '#/components/schemas/RiskStoryCompleteness'}}}}}
  /anrs/{anrId}/template:
    get:
      operationId: getScenarioTemplateSnapshot
      summary: Read the authorised Scenario ANR's immutable template snapshot
      parameters: [{$ref: '#/components/parameters/AnrId'}]
      responses:
        '200': {description: Selected template and immutable snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioTemplateResult'}}}}
        '404': {description: No template has been selected for this Scenario ANR.}
    post:
      operationId: instantiateScenarioCatalogTemplate
      summary: Instantiate one published catalog template into an authorised Scenario ANR
      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScenarioTemplateInstantiation'}}}}
      responses:
        '200': {description: Immutable client snapshot, including local-tailoring records.}
        '403': {description: The caller cannot create within the target ANR.}
        '404': {description: The requested template version is unavailable for new use.}
        '409': {$ref: '#/components/responses/RevisionConflict'}
  /frontoffice/templates:
    get:
      operationId: listFrontOfficePublishedScenarioTemplates
      summary: List only currently published Scenario template releases for an authorised FrontOffice session
      security:
        - scenarioBridgeService: []
          scenarioSession: []
      parameters: [{$ref: '#/components/parameters/CatalogLocale'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {$ref: '#/components/parameters/CatalogSearch'}]
      responses:
        '200': {description: Published-template projection, content: {application/json: {schema: {$ref: '#/components/schemas/FrontOfficeTemplatePage'}}}}
        '401': {description: Missing or expired Scenario session.}
        '403': {description: Session is not a current FrontOffice user session.}
  /backoffice/catalog/events:
    get:
      operationId: listScenarioCatalogEvents
      summary: List published or deprecated event definitions
      parameters: [{$ref: '#/components/parameters/CatalogLocale'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {$ref: '#/components/parameters/CatalogSearch'}]
      responses:
        '200':
          description: A paginated public catalog page; drafts are never returned to unauthorised callers.
          content: {application/json: {schema: {$ref: '#/components/schemas/CatalogPage'}}}
    post:
      operationId: createScenarioCatalogEventDraft
      summary: Create an event-definition draft
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogWrite'}}}}
      responses:
        '200': {description: Draft created, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogResource'}}}}
  /backoffice/catalog/events/{id}:
    get:
      operationId: getScenarioCatalogEvent
      summary: Read a catalog event version
      parameters: [{$ref: '#/components/parameters/CatalogId'}, {$ref: '#/components/parameters/CatalogLocale'}, {$ref: '#/components/parameters/CatalogVersion'}]
      responses: {'200': {description: Catalog event, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogResource'}}}}}
    put:
      operationId: updateScenarioCatalogEventDraft
      summary: Update a draft or create the next immutable version
      parameters: [{$ref: '#/components/parameters/CatalogId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogWrite'}}}}
      responses: {'200': {description: Updated draft}, '409': {$ref: '#/components/responses/RevisionConflict'}}
  /backoffice/catalog/events/{id}/versions:
    get:
      operationId: listScenarioCatalogEventVersions
      summary: List readable event-definition versions
      parameters: [{$ref: '#/components/parameters/CatalogId'}, {$ref: '#/components/parameters/CatalogLocale'}]
      responses: {'200': {description: Readable event versions, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/CatalogResource'}}}}}}
  /backoffice/catalog/templates:
    get:
      operationId: listScenarioCatalogTemplates
      summary: List published or deprecated scenario templates
      parameters: [{$ref: '#/components/parameters/CatalogLocale'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {$ref: '#/components/parameters/CatalogSearch'}]
      responses: {'200': {description: Catalog page, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogPage'}}}}}
    post:
      operationId: createScenarioCatalogTemplateDraft
      summary: Create a scenario-template draft
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogWrite'}}}}
      responses: {'200': {description: Draft created}}
  /backoffice/catalog/templates/{id}:
    get:
      operationId: getScenarioCatalogTemplate
      summary: Read a catalog template version
      parameters: [{$ref: '#/components/parameters/CatalogId'}, {$ref: '#/components/parameters/CatalogLocale'}, {$ref: '#/components/parameters/CatalogVersion'}]
      responses: {'200': {description: Catalog template, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogResource'}}}}}
    put:
      operationId: updateScenarioCatalogTemplateDraft
      summary: Update a draft or create the next immutable template version
      parameters: [{$ref: '#/components/parameters/CatalogId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogWrite'}}}}
      responses: {'200': {description: Updated draft}, '409': {$ref: '#/components/responses/RevisionConflict'}}
  /backoffice/catalog/templates/{id}/versions:
    get:
      operationId: listScenarioCatalogTemplateVersions
      summary: List readable scenario-template versions
      parameters: [{$ref: '#/components/parameters/CatalogId'}, {$ref: '#/components/parameters/CatalogLocale'}]
      responses: {'200': {description: Readable template versions, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/CatalogResource'}}}}}}
  /backoffice/catalog/{kind}/{id}/{action}:
    post:
      operationId: transitionScenarioCatalogLifecycle
      summary: Review, publish, or deprecate a catalog version
      parameters: [{$ref: '#/components/parameters/CatalogKind'}, {$ref: '#/components/parameters/CatalogId'}, {$ref: '#/components/parameters/CatalogAction'}, {$ref: '#/components/parameters/IfMatch'}]
      responses: {'200': {description: Lifecycle transition completed}, '409': {$ref: '#/components/responses/RevisionConflict'}}
components:
  securitySchemes:
    monarcToken:
      type: apiKey
      in: header
      name: token
      description: Legacy MONARC authentication during the approved transition.
    scenarioBridgeService:
      type: apiKey
      in: header
      name: X-Scenario-Service-Token
      description: Internal BFF-to-MONARC credential supplied by the approved secret manager.
    scenarioSession:
      type: apiKey
      in: header
      name: X-Scenario-Session
      description: Opaque, BFF-held Scenario session used only with scenarioBridgeService.
  parameters:
    CatalogLocale:
      name: locale
      in: query
      required: false
      schema: {type: string, pattern: '^[a-z]{2,3}(?:-[A-Z]{2})?$'}
      description: Preferred catalogue-content locale. English is used as the fallback.
    AnrId:
      name: anrId
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    ScenarioId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProfileVersionId:
      name: profileVersionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SupervisorId:
      name: supervisorId
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema: {type: string, format: uuid}
    RelationResource:
      name: relationResource
      in: path
      required: true
      schema: {type: string, enum: [edges, event-consequences, subject-links, control-links]}
    CatalogVersion:
      name: version
      in: query
      required: false
      schema: {type: integer, minimum: 1}
      description: Immutable catalogue version to read. Omit only when requesting the current authoring version.
    Page:
      name: page
      in: query
      required: false
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    CatalogSearch:
      name: search
      in: query
      required: false
      schema: {type: string, maxLength: 100}
    CatalogId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    CatalogKind:
      name: kind
      in: path
      required: true
      schema: {type: string, enum: [events, templates]}
    CatalogAction:
      name: action
      in: path
      required: true
      schema: {type: string, enum: [review, publish, deprecate]}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: integer, minimum: 0}
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Caller-supplied request correlation identifier.
  headers:
    CorrelationId:
      description: Request correlation identifier returned when the server has one.
      schema:
        type: string
        maxLength: 128
  responses:
    NotFound:
      description: The requested Scenario resource was not found in the authorised scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidHandoff:
      description: Privacy-safe failure for malformed, expired, replayed or unauthorised handoffs and sessions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RevisionConflict:
      description: The catalog version changed; reload it before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The authenticated user is not authorised for this Scenario operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    CatalogPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties: {items: {type: array, items: {$ref: '#/components/schemas/CatalogResource'}}}
    FrontOfficeTemplatePage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties: {items: {type: array, items: {$ref: '#/components/schemas/FrontOfficeTemplate'}}}
    FrontOfficeTemplate:
      type: object
      required: [stableUuid, version, title, description, locale, provenance]
      properties:
        stableUuid: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        title: {type: string}
        description: {type: string}
        locale: {type: string}
        provenance: {type: string}
        releaseUuid: {type: string, format: uuid, nullable: true}
        releasedAt: {type: string, format: date-time, nullable: true}
    ScenarioTemplateResult:
      type: object
      required: [analysis, snapshot]
      properties:
        analysis: {$ref: '#/components/schemas/ScenarioAnalysis'}
        snapshot: {$ref: '#/components/schemas/ScenarioTemplateSnapshot'}
    ScenarioTemplateSnapshot:
      type: object
      required: [uuid, catalogTemplateUuid, catalogTemplateVersion, catalogReleaseChecksum, catalogProvenance, payload, records]
      properties:
        uuid: {type: string, format: uuid}
        catalogTemplateUuid: {type: string, format: uuid}
        catalogTemplateVersion: {type: integer, minimum: 1}
        catalogReleaseChecksum: {type: string}
        catalogProvenance: {type: string}
        payload: {type: object, additionalProperties: true}
        records: {type: array, items: {type: object, additionalProperties: true}}
    CatalogResource:
      type: object
      required: [stableUuid, version, lifecycle, revision]
      properties:
        stableUuid: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        semanticVersion: {type: string, pattern: '^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?$'}
        lifecycle: {type: string, enum: [draft, review, published, deprecated]}
        revision: {type: integer, minimum: 1}
        provenance: {type: string}
        authorId: {type: integer, minimum: 1}
        reviewerId: {type: integer, minimum: 1, nullable: true}
        publishedAt: {type: string, format: date-time, nullable: true}
        deprecatedAt: {type: string, format: date-time, nullable: true}
        category: {type: string}
        guidance: {type: string, nullable: true}
        assessmentGuidance: {type: string, nullable: true}
        translation: {$ref: '#/components/schemas/CatalogTranslation'}
        translations: {type: array, items: {$ref: '#/components/schemas/CatalogTranslation'}}
    CatalogWrite:
      type: object
      required: [provenance, translations]
      properties:
        provenance: {type: string, maxLength: 65535}
        category: {type: string, maxLength: 100}
        semanticVersion: {type: string, pattern: '^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?$'}
        tags: {type: array, maxItems: 30, items: {type: string, maxLength: 100}}
        references: {type: array, items: {$ref: '#/components/schemas/CatalogReference'}}
        suggestions: {type: array, items: {$ref: '#/components/schemas/CatalogSuggestion'}}
        eventRefs: {type: array, items: {$ref: '#/components/schemas/CatalogVersionReference'}}
        translations: {type: object, additionalProperties: {$ref: '#/components/schemas/CatalogTranslation'}}
    CatalogTranslation:
      type: object
      required: [title, description]
      properties:
        title: {type: string, minLength: 1, maxLength: 255}
        description: {type: string}
        riskSourceGuidance: {type: string}
        causeGuidance: {type: string}
        consequenceGuidance: {type: string}
        subjectGuidance: {type: string}
        controlGuidance: {type: string}
        monitoringGuidance: {type: string}
    CatalogReference:
      type: object
      required: [type, value]
      properties:
        type: {type: string, maxLength: 32}
        value: {type: string, maxLength: 255}
    CatalogVersionReference:
      type: object
      required: [stableUuid, version]
      properties:
        stableUuid: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
    CatalogSuggestion:
      type: object
      required: [type, referenceType, referenceValue]
      properties:
        type: {type: string, maxLength: 32}
        referenceType: {type: string, maxLength: 32}
        referenceValue: {type: string, maxLength: 255}
        guidance: {type: string}
    ProbeStatus:
      type: object
      required: [status, service, version, enabled]
      properties:
        status:
          type: string
          enum: [ok, ready, not_ready]
        service:
          type: string
          enum: [scenario]
        version:
          type: string
          enum: [v1]
        enabled:
          type: boolean
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code:
              type: string
            message:
              type: string
            correlationId:
              type: string
    Page:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    ScenarioIdentifier:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        anrId:
          type: integer
          minimum: 1
          description: Legacy numeric ANR identifier where an ANR scope is needed.
    ScenarioAnalysis:
      type: object
      required: [uuid, anrId, lifecycle, languageCode, revision, createdAt, updatedAt]
      properties:
        uuid: {type: string, format: uuid}
        anrId: {type: integer, minimum: 1}
        lifecycle: {type: string, enum: [draft, active, monitored, closed, archived]}
        ownerId: {type: integer, minimum: 1, nullable: true}
        languageCode: {type: string}
        nextReviewAt: {type: string, format: date-time, nullable: true}
        sourceAnrId: {type: integer, minimum: 1, nullable: true}
        revision: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ScenarioAnalysisCreate:
      type: object
      additionalProperties: false
      required: [languageCode]
      properties:
        languageCode: {type: string, pattern: '^[a-z]{2,3}(?:-[A-Z]{2})?$'}
        nextReviewAt: {type: string, format: date-time}
        sourceAnrId: {type: integer, minimum: 1}
    RiskScenarioPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties: {items: {type: array, items: {$ref: '#/components/schemas/RiskScenario'}}}
    RiskStoryReference:
      type: object
      required: [value, label, type, available]
      properties:
        value: {type: string}
        label: {type: string}
        type: {type: string}
        available: {type: boolean}
    RiskStoryReferencePage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties: {items: {type: array, items: {$ref: '#/components/schemas/RiskStoryReference'}}}
    RiskScenario:
      type: object
      required: [uuid, anrId, title, revision, createdAt, updatedAt]
      properties:
        uuid: {type: string, format: uuid}
        anrId: {type: integer, minimum: 1}
        title: {type: string, maxLength: 255}
        sourceSnapshotUuid: {type: string, format: uuid, nullable: true}
        sourceInstanceRecordUuid: {type: string, format: uuid, nullable: true}
        provenance: {type: string, nullable: true}
        riskSource: {$ref: '#/components/schemas/RiskStoryRecord', nullable: true}
        cause: {$ref: '#/components/schemas/RiskStoryRecord', nullable: true}
        events: {type: array, items: {$ref: '#/components/schemas/RiskStoryNode'}}
        consequences: {type: array, items: {$ref: '#/components/schemas/RiskStoryNode'}}
        edges: {type: array, items: {$ref: '#/components/schemas/RiskStoryRelation'}}
        eventConsequences: {type: array, items: {$ref: '#/components/schemas/RiskStoryRelation'}}
        subjectLinks: {type: array, items: {$ref: '#/components/schemas/RiskStoryRelation'}}
        controlLinks: {type: array, items: {$ref: '#/components/schemas/RiskStoryRelation'}}
        revision: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    RiskScenarioWrite:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 255}
        sourceSnapshotUuid: {type: string, format: uuid, nullable: true}
        sourceInstanceRecordUuid: {type: string, format: uuid, nullable: true}
        provenance: {type: string, maxLength: 255}
    RiskScenarioUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: {type: string, minLength: 1, maxLength: 255}
        sourceSnapshotUuid: {type: string, format: uuid, nullable: true}
        sourceInstanceRecordUuid: {type: string, format: uuid, nullable: true}
        provenance: {type: string, maxLength: 255, nullable: true}
    RiskStoryRecord:
      type: object
      required: [uuid, title, revision]
      properties:
        uuid: {type: string, format: uuid}
        title: {type: string, maxLength: 255}
        narrative: {type: string, nullable: true}
        legacyRiskSourceId: {type: string, nullable: true}
        threatReferenceUuid: {type: string, format: uuid, nullable: true}
        vulnerabilityReferenceUuid: {type: string, format: uuid, nullable: true}
        revision: {type: integer, minimum: 1}
        scenarioRevision: {type: integer, minimum: 1}
    RiskSourceWrite:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 255}
        narrative: {type: string, maxLength: 65535}
        legacyRiskSourceId: {type: string, maxLength: 36}
    RiskSourceUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: {type: string, minLength: 1, maxLength: 255}
        narrative: {type: string, maxLength: 65535, nullable: true}
        legacyRiskSourceId: {type: string, maxLength: 36, nullable: true}
    CauseWrite:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 255}
        narrative: {type: string, maxLength: 65535}
        threatReferenceUuid: {type: string, format: uuid}
        vulnerabilityReferenceUuid: {type: string, format: uuid}
    CauseUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: {type: string, minLength: 1, maxLength: 255}
        narrative: {type: string, maxLength: 65535, nullable: true}
        threatReferenceUuid: {type: string, format: uuid, nullable: true}
        vulnerabilityReferenceUuid: {type: string, format: uuid, nullable: true}
    RiskStoryNode:
      type: object
      required: [uuid, title, revision]
      properties:
        uuid: {type: string, format: uuid}
        title: {type: string, maxLength: 255}
        narrative: {type: string, nullable: true}
        revision: {type: integer, minimum: 1}
        scenarioRevision: {type: integer, minimum: 1}
    RiskStoryNodePage:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/RiskStoryNode'}}}
    RiskStoryNodeWrite:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 255}
        narrative: {type: string, maxLength: 65535}
    RiskStoryNodeUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: {type: string, minLength: 1, maxLength: 255}
        narrative: {type: string, maxLength: 65535, nullable: true}
    RiskStoryRelation:
      type: object
      required: [uuid, revision]
      properties:
        uuid: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        scenarioRevision: {type: integer, minimum: 1}
        fromEventUuid: {type: string, format: uuid}
        toEventUuid: {type: string, format: uuid}
        eventUuid: {type: string, format: uuid}
        consequenceUuid: {type: string, format: uuid}
        targetType: {type: string, enum: [risk_scenario, event, consequence]}
        targetUuid: {type: string, format: uuid}
        subjectType: {type: string, enum: [asset, process, object, information, supplier, objective]}
        subjectReferenceUuid: {type: string, format: uuid}
        controlReferenceUuid: {type: string, format: uuid}
        relationshipIntent: {type: string, enum: [existing, proposed]}
        narrative: {type: string, nullable: true}
    RiskStoryRelationPage:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/RiskStoryRelation'}}}
    EventEdgeWrite:
      type: object
      additionalProperties: false
      required: [fromEventUuid, toEventUuid]
      properties:
        fromEventUuid: {type: string, format: uuid}
        toEventUuid: {type: string, format: uuid}
    EventConsequenceWrite:
      type: object
      additionalProperties: false
      required: [eventUuid, consequenceUuid]
      properties:
        eventUuid: {type: string, format: uuid}
        consequenceUuid: {type: string, format: uuid}
    SubjectLinkWrite:
      type: object
      additionalProperties: false
      required: [subjectType, subjectReferenceUuid]
      properties:
        targetType: {type: string, enum: [risk_scenario, event, consequence]}
        targetUuid: {type: string, format: uuid}
        subjectType: {type: string, enum: [asset, process, object, information, supplier, objective]}
        subjectReferenceUuid: {type: string, format: uuid}
        relationshipIntent: {type: string, maxLength: 32}
        narrative: {type: string, maxLength: 65535}
    ControlLinkWrite:
      type: object
      additionalProperties: false
      required: [controlReferenceUuid, relationshipIntent]
      properties:
        targetType: {type: string, enum: [risk_scenario, event, consequence]}
        targetUuid: {type: string, format: uuid}
        controlReferenceUuid: {type: string, format: uuid}
        relationshipIntent: {type: string, enum: [existing, proposed]}
        narrative: {type: string, maxLength: 65535}
    RiskStoryCompleteness:
      type: object
      required: [complete, warnings]
      properties:
        complete: {type: boolean}
        warnings:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              riskScenarioUuid: {type: string, format: uuid}
              code: {type: string}
              message: {type: string}
    ScenarioAnalysisUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        lifecycle: {type: string, enum: [draft, active, monitored, closed, archived]}
        nextReviewAt: {type: string, format: date-time, nullable: true}
        rationale: {type: string, maxLength: 2000, nullable: true}
    ScenarioTemplateInstantiation:
      type: object
      additionalProperties: false
      required: [templateUuid, templateVersion]
      properties:
        templateUuid: {type: string, format: uuid}
        templateVersion: {type: integer, minimum: 1}
    LegacyHandoffIssueRequest:
      type: object
      additionalProperties: false
      required: [nonce, returnPath]
      properties:
        anrId:
          type: integer
          minimum: 1
          description: Required for FrontOffice ANR-scoped handoffs; omitted for BackOffice catalog handoffs.
        nonce:
          type: string
          minLength: 16
          maxLength: 256
        returnPath:
          type: string
          pattern: '^/(?!/)'
          maxLength: 255
    LegacyHandoffIssueResponse:
      type: object
      required: [code, expiresAt, returnPath]
      properties:
        code:
          type: string
          minLength: 32
          maxLength: 512
        expiresAt:
          type: integer
          format: int64
        returnPath:
          type: string
    LegacyHandoffConsumeRequest:
      type: object
      required: [code, nonce, audience]
      properties:
        code:
          type: string
          minLength: 32
          maxLength: 512
        nonce:
          type: string
          minLength: 16
          maxLength: 256
        audience:
          type: string
          enum: [scenario-ui]
    ScenarioSessionReference:
      type: object
      required: [session]
      properties:
        session:
          type: string
          minLength: 32
          maxLength: 512
    ScenarioSession:
      type: object
      required: [session, subject, office, expiresAt]
      properties:
        session:
          type: string
          description: Opaque value intended only for the BFF session cookie.
        subject:
          type: string
        anrId:
          type: integer
          minimum: 1
          description: Present for FrontOffice ANR-scoped sessions; omitted for BackOffice catalog sessions.
        office:
          type: string
          enum: [frontoffice, backoffice]
        expiresAt:
          type: integer
          format: int64
    CriteriaProfileList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/CriteriaProfile'}}
    CriteriaProfile:
      type: object
      required: [uuid, versionUuid, identifier, title, revision, version, payload]
      properties:
        uuid: {type: string, format: uuid}
        versionUuid: {type: string, format: uuid}
        identifier: {type: string}
        title: {type: string}
        revision: {type: integer, minimum: 1}
        version: {type: integer, minimum: 1}
        payload: {$ref: '#/components/schemas/CriteriaProfileWrite'}
    CriteriaProfileWrite:
      type: object
      required: [identifier, title, likelihoodLabels, consequenceLabels, dimensions, aggregationPolicy, bands, acceptanceRules]
      properties:
        identifier: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,99}$'}
        title: {type: string, minLength: 1, maxLength: 255}
        likelihoodLabels: {type: array, items: {$ref: '#/components/schemas/OrderedLabel'}}
        consequenceLabels: {type: array, items: {$ref: '#/components/schemas/OrderedLabel'}}
        dimensions: {type: array, items: {type: string}}
        aggregationPolicy: {type: string, enum: [highest_consequence_dimension]}
        bands: {type: object}
        acceptanceRules: {type: object}
    AssignedCriteriaProfile:
      type: object
      required: [item]
      properties:
        item:
          allOf:
            - {$ref: '#/components/schemas/CriteriaProfile'}
          nullable: true
    OrderedLabel:
      type: object
      required: [value, label]
      properties:
        value: {type: integer, minimum: 1, maximum: 5}
        label: {type: string}
    AssessmentWrite:
      type: object
      required: [assessmentType, profileVersionUuid, likelihood, dimensionSeverities, rationale]
      properties:
        assessmentType: {type: string, enum: [inherent, current, proposed_residual]}
        profileVersionUuid: {type: string, format: uuid}
        likelihood: {type: integer, minimum: 1, maximum: 5}
        dimensionSeverities: {type: object, additionalProperties: {type: integer, minimum: 1, maximum: 5}}
        controlReferences: {type: array, items: {type: string, format: uuid}}
        evidenceReferences: {type: array, items: {type: string, format: uuid}}
        rationale: {type: string, minLength: 1}
        legacyComparison: {type: object, nullable: true, description: Labelled comparison evidence only; never a Scenario score.}
    Assessment:
      type: object
      required: [uuid, assessmentType, revision, calculation]
      properties:
        uuid: {type: string, format: uuid}
        assessmentType: {type: string}
        revision: {type: integer, minimum: 1}
        calculation: {type: object, description: Immutable explainable calculation snapshot.}
        legacyComparison: {type: object, nullable: true, description: Labelled legacy comparison evidence only.}
        supersedesUuid: {type: string, format: uuid, nullable: true}
    AssessmentList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Assessment'}}
    TreatmentWrite:
      type: object
      required: [treatmentType, actionText, status]
      properties:
        treatmentType: {type: string, enum: [avoid, modify, share, retain]}
        actionText: {type: string, minLength: 1}
        ownerId: {type: integer, minimum: 1, nullable: true}
        dueAt: {type: string, format: date-time, nullable: true}
        status: {type: string, enum: [planned, in_progress, completed, cancelled]}
    Treatment:
      allOf:
        - {$ref: '#/components/schemas/TreatmentWrite'}
        - type: object
          required: [uuid, revision]
          properties: {uuid: {type: string, format: uuid}, revision: {type: integer, minimum: 1}}
    TreatmentList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/Treatment'}}}
    MonitoringWrite:
      type: object
      required: [indicator, reassessmentTrigger]
      properties:
        indicator: {type: string, minLength: 1, maxLength: 255}
        reassessmentTrigger: {type: string, minLength: 1}
        observation: {type: string, nullable: true}
    Monitoring:
      allOf:
        - {$ref: '#/components/schemas/MonitoringWrite'}
        - type: object
          required: [uuid, revision]
          properties: {uuid: {type: string, format: uuid}, revision: {type: integer, minimum: 1}}
    MonitoringList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/Monitoring'}}}
    AcceptanceWrite:
      type: object
      required: [assessmentUuid, assignedSupervisorId, decision, reason]
      properties:
        assessmentUuid: {type: string, format: uuid}
        assignedSupervisorId: {type: integer, minimum: 1}
        decision: {type: string, enum: [accepted, not_accepted]}
        reason: {type: string, minLength: 1}
    Acceptance:
      type: object
      required: [uuid, assignedSupervisorId, revision, decision]
      properties:
        uuid: {type: string, format: uuid}
        assignedSupervisorId: {type: integer, minimum: 1}
        revision: {type: integer, minimum: 1}
        decision: {type: object}
    AcceptanceList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/Acceptance'}}}
    ScenarioSupervisorWrite:
      type: object
      required: [linkedUserId, isActive]
      additionalProperties: false
      properties:
        linkedUserId: {type: integer, minimum: 1}
        isActive: {type: boolean}
    ScenarioSupervisor:
      type: object
      required: [id, linkedUserId, name, email, roles, isActive]
      properties:
        id: {type: integer, minimum: 1}
        linkedUserId: {type: integer, minimum: 1}
        name: {type: string}
        email: {type: string, format: email}
        roles: {type: array, items: {type: string}}
        isActive: {type: boolean}
    ScenarioSupervisorList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/ScenarioSupervisor'}}}
    ScenarioLinkableUser:
      type: object
      required: [id, firstname, lastname, email]
      properties:
        id: {type: integer, minimum: 1}
        firstname: {type: string}
        lastname: {type: string}
        email: {type: string, format: email}
    ScenarioLinkableUserList:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/ScenarioLinkableUser'}}}
