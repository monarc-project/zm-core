      parameters: [{$ref: '#/components/parameters/AnrId'}, {$ref: '#/components/parameters/ScenarioId'}]
      responses: {'200': {description: SRA-11 completeness report, content: {application/json: {schema: {$ref: '#/components/schemas/RiskScenarioCompleteness'}}}}}
  /anrs/{anrId}/risk-scenarios/{id}/status:
    get:
      operationId: getScenarioRiskScenarioStatus
