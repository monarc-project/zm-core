      operationId: createScenarioCatalogTemplateDraft
      summary: Create a scenario-template draft
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogWrite'}}}}
      responses: {'200': {description: Draft created}}
  /backoffice/catalog/templates/{id}:
    get:
      operationId: getScenarioCatalogTemplate
      summary: Read a catalog template version
      parameters: [{$ref: '#/components/parameters/CatalogId'}, {$ref: '#/components/parameters/CatalogLocale'}, {$ref: '#/components/parameters/CatalogVersion'}]
      responses: {'200': {description: Catalog template, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogResource'}}}}}
    put:
      operationId: updateScenarioCatalogTemplateDraft
      summary: Update a draft or create the next immutable template version
      parameters: [{$ref: '#/components/parameters/CatalogId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogWrite'}}}}
      responses: {'200': {description: Updated draft}, '409': {$ref: '#/components/responses/RevisionConflict'}}
  /backoffice/catalog/templates/{id}/versions:
    get:
      operationId: listScenarioCatalogTemplateVersions
      summary: List readable scenario-template versions
      parameters: [{$ref: '#/components/parameters/CatalogId'}, {$ref: '#/components/parameters/CatalogLocale'}]
      responses: {'200': {description: Readable template versions, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/CatalogResource'}}}}}}
  /backoffice/catalog/{kind}/{id}/{action}:
    post:
      operationId: transitionScenarioCatalogLifecycle
      summary: Review, publish, or deprecate a catalog version
      parameters: [{$ref: '#/components/parameters/CatalogKind'}, {$ref: '#/components/parameters/CatalogId'}, {$ref: '#/components/parameters/CatalogAction'}, {$ref: '#/components/parameters/IfMatch'}]
      responses: {'200': {description: Lifecycle transition completed}, '409': {$ref: '#/components/responses/RevisionConflict'}}
components:
  securitySchemes:
    monarcToken:
      type: apiKey
      in: header
      name: token
      description: Legacy MONARC authentication during the approved transition.
    scenarioBridgeService:
      type: apiKey
      in: header
      name: X-Scenario-Service-Token
      description: Internal BFF-to-MONARC credential supplied by the approved secret manager.
    scenarioSession:
      type: apiKey
      in: header
      name: X-Scenario-Session
      description: Opaque, BFF-held Scenario session used only with scenarioBridgeService.
  parameters:
    CatalogLocale:
      name: locale
      in: query
      required: false
      schema: {type: string, pattern: '^[a-z]{2,3}(?:-[A-Z]{2})?$'}
      description: Preferred catalogue-content locale. English is used as the fallback.
    AnrId:
      name: anrId
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    ScenarioId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    TemplateEventRecordId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    CaseId:
      name: caseId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ReviewAction:
      name: action
      in: path
      required: true
      schema: {type: string, enum: [assign, scope, dispositions, complete, dismiss]}
    TreatmentId:
      name: treatmentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ImplementationId:
      name: implementationId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProfileVersionId:
      name: profileVersionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SupervisorId:
      name: supervisorId
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema: {type: string, format: uuid}
    RelationResource:
      name: relationResource
      in: path
      required: true
      schema: {type: string, enum: [edges, event-consequences, subject-links, control-links]}
    CatalogVersion:
      name: version
      in: query
      required: false
      schema: {type: integer, minimum: 1}
      description: Immutable catalogue version to read. Omit only when requesting the current authoring version.
    Page:
      name: page
      in: query
      required: false
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    CatalogSearch:
      name: search
      in: query
      required: false
      schema: {type: string, maxLength: 100}
    CatalogId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    CatalogKind:
      name: kind
      in: path
      required: true
      schema: {type: string, enum: [events, templates]}
    CatalogAction:
      name: action
      in: path
      required: true
      schema: {type: string, enum: [review, publish, deprecate]}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: integer, minimum: 0}
    ScenarioRevision:
      name: X-Scenario-Revision
      in: header
      required: true
      schema: {type: integer, minimum: 1}
      description: Current risk-scenario revision, required alongside the treatment revision in If-Match.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
      description: Stable key for retrying one treatment-plan mutation without duplicating history evidence.
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Caller-supplied request correlation identifier.
  headers:
    CorrelationId:
      description: Request correlation identifier returned when the server has one.
      schema:
        type: string
        maxLength: 128
  responses:
    NotFound:
      description: The requested Scenario resource was not found in the authorised scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidHandoff:
      description: Privacy-safe failure for malformed, expired, replayed or unauthorised handoffs and sessions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RevisionConflict:
      description: The catalog version changed; reload it before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The authenticated user is not authorised for this Scenario operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    CatalogPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties: {items: {type: array, items: {$ref: '#/components/schemas/CatalogResource'}}}
    FrontOfficeTemplatePage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties: {items: {type: array, items: {$ref: '#/components/schemas/FrontOfficeTemplate'}}}
    FrontOfficeTemplate:
      type: object
      required: [stableUuid, version, title, description, locale, provenance]
      properties:
        stableUuid: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        title: {type: string}
        description: {type: string}
        locale: {type: string}
        provenance: {type: string}
        releaseUuid: {type: string, format: uuid, nullable: true}
        releasedAt: {type: string, format: date-time, nullable: true}
    ScenarioTemplateResult:
      type: object
      required: [analysis, snapshot]
      properties:
        analysis: {$ref: '#/components/schemas/ScenarioAnalysis'}
        snapshot: {$ref: '#/components/schemas/ScenarioTemplateSnapshot'}
    ScenarioTemplateSnapshot:
      type: object
      required: [uuid, catalogTemplateUuid, catalogTemplateVersion, catalogReleaseChecksum, catalogProvenance, payload, records]
      properties:
        uuid: {type: string, format: uuid}
        catalogTemplateUuid: {type: string, format: uuid}
        catalogTemplateVersion: {type: integer, minimum: 1}
        catalogReleaseChecksum: {type: string}
        catalogProvenance: {type: string}
        payload: {type: object, additionalProperties: true}
        records: {type: array, items: {type: object, additionalProperties: true}}
    CatalogResource:
      type: object
      required: [stableUuid, version, lifecycle, revision]
      properties:
        stableUuid: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        semanticVersion: {type: string, pattern: '^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?$'}
        lifecycle: {type: string, enum: [draft, review, published, deprecated]}
        revision: {type: integer, minimum: 1}
        provenance: {type: string}
        authorId: {type: integer, minimum: 1}
        reviewerId: {type: integer, minimum: 1, nullable: true}
        publishedAt: {type: string, format: date-time, nullable: true}
        deprecatedAt: {type: string, format: date-time, nullable: true}
        category: {type: string}
        guidance: {type: string, nullable: true}
        assessmentGuidance: {type: string, nullable: true}
        translation: {$ref: '#/components/schemas/CatalogTranslation'}
        translations: {type: array, items: {$ref: '#/components/schemas/CatalogTranslation'}}
        riskScenarioModels: {type: array, items: {$ref: '#/components/schemas/CatalogTemplateRiskScenarioModel'}}
        publicationWarnings: {type: object, additionalProperties: true}
    CatalogWrite:
      type: object
      required: [translations]
      properties:
        category: {type: string, maxLength: 100}
        semanticVersion: {type: string, pattern: '^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?$'}
        tags: {type: array, maxItems: 30, items: {type: string, maxLength: 100}}
        references: {type: array, items: {$ref: '#/components/schemas/CatalogReference'}}
        suggestions: {type: array, items: {$ref: '#/components/schemas/CatalogSuggestion'}}
        eventRefs: {type: array, items: {$ref: '#/components/schemas/CatalogVersionReference'}}
        riskScenarioModels: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/CatalogTemplateRiskScenarioModelWrite'}}
        translations: {type: object, additionalProperties: {$ref: '#/components/schemas/CatalogTranslation'}}
    CatalogTemplateRiskScenarioModel:
      type: object
      required: [stableUuid, title, position, revision, eventLinks]
      properties:
        stableUuid: {type: string, format: uuid}
        title: {type: string, maxLength: 255}
        description: {type: string, nullable: true}
        position: {type: integer, minimum: 1}
        revision: {type: integer, minimum: 1}
        eventLinks: {type: array, items: {$ref: '#/components/schemas/CatalogTemplateModelEventLink'}}
    CatalogTemplateRiskScenarioModelWrite:
      type: object
      required: [title, eventLinks]
      properties:
        stableUuid: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 255}
        description: {type: string, nullable: true}
        position: {type: integer, minimum: 1}
        eventLinks: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/CatalogTemplateModelEventLinkWrite'}}
    CatalogTemplateModelEventLink:
      type: object
      required: [stableUuid, version, title, position]
      properties:
        stableUuid: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        title: {type: string}
        guidance: {type: string, nullable: true}
        position: {type: integer, minimum: 1}
    CatalogTemplateModelEventLinkWrite:
      type: object
      required: [stableUuid, version]
      properties:
        stableUuid: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        guidance: {type: string, nullable: true}
        position: {type: integer, minimum: 1}
    ScenarioTemplateEventEvaluationWrite:
      type: object
      required: [state]
      properties:
        state: {type: string, enum: [not_evaluated, relevant, not_relevant, requires_follow_up]}
        comment: {type: string, maxLength: 65535, nullable: true}
    ScenarioTemplateEventEvaluation:
      type: object
      required: [eventRecordUuid, eventStableUuid, eventVersion, eventTitle, state, comment, revision]
      properties:
        eventRecordUuid: {type: string, format: uuid}
        eventStableUuid: {type: string, format: uuid}
        eventVersion: {type: integer, minimum: 1}
        eventTitle: {type: string}
        guidance: {type: string, nullable: true}
        state: {type: string, enum: [not_evaluated, relevant, not_relevant, requires_follow_up]}
        comment: {type: string, nullable: true}
        revision: {type: integer, minimum: 0}
        actorId: {type: integer, nullable: true}
        evaluatedAt: {type: string, format: date-time, nullable: true}
    ScenarioTemplateEventEvaluationGroup:
      type: object
      required: [modelRecordUuid, modelStableUuid, title, position, sourceRevision, events]
      properties:
        modelRecordUuid: {type: string, format: uuid}
        modelStableUuid: {type: string, format: uuid}
        title: {type: string}
        description: {type: string, nullable: true}
        position: {type: integer, minimum: 1}
        sourceRevision: {type: integer, minimum: 1}
        events: {type: array, items: {$ref: '#/components/schemas/ScenarioTemplateEventEvaluation'}}
        existingDerivations:
          type: array
          description: Visible only to an authorised writer; readers cannot enumerate local derivations.
          items: {$ref: '#/components/schemas/ScenarioTemplateModelRiskScenarioDerivationSummary'}
    ScenarioTemplateEventEvaluationList:
      type: object
      required: [compatibility, canEdit, groups]
      properties:
        compatibility: {type: string, enum: [modeled, no_template, legacy_snapshot, no_models, no_events]}
        canEdit: {type: boolean}
        template:
          allOf:
            - {$ref: '#/components/schemas/ScenarioTemplateEventEvaluationTemplate'}
          nullable: true
        groups: {type: array, items: {$ref: '#/components/schemas/ScenarioTemplateEventEvaluationGroup'}}
    ScenarioTemplateEventEvaluationTemplate:
      type: object
      required: [snapshotUuid, stableUuid, version, title]
      properties:
        snapshotUuid: {type: string, format: uuid}
        stableUuid: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        title: {type: string}
    ScenarioTemplateModelRiskScenarioCreation:
      type: object
      required: [idempotencyKey, sourceRevision, models]
      properties:
        idempotencyKey: {type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$'}
        sourceRevision: {type: integer, minimum: 1}
        models:
          type: array
          minItems: 1
          maxItems: 20
          items: {$ref: '#/components/schemas/ScenarioTemplateModelRiskScenarioCreateItem'}
    ScenarioTemplateModelRiskScenarioCreateItem:
      type: object
      required: [modelRecordUuid, sourceRevision, title, eventRecordUuids]
      properties:
        modelRecordUuid: {type: string, format: uuid}
        sourceRevision: {type: integer, minimum: 1}
        title: {type: string, minLength: 1, maxLength: 255}
        description: {type: string, maxLength: 65535, nullable: true}
        eventRecordUuids:
          type: array
          maxItems: 100
          items: {type: string, format: uuid}
          uniqueItems: true
    ScenarioTemplateModelRiskScenarioCreationResult:
      type: object
      required: [replayed, items]
      properties:
        replayed: {type: boolean}
        items:
          type: array
          items: {$ref: '#/components/schemas/ScenarioTemplateModelRiskScenarioDerivationSummary'}
    ScenarioTemplateModelRiskScenarioDerivationSummary:
      type: object
      required: [riskScenarioUuid, title, createdAt]
      properties:
        riskScenarioUuid: {type: string, format: uuid}
        title: {type: string}
        createdAt: {type: string, format: date-time}
    CatalogTranslation:
      type: object
      required: [title]
      properties:
        locale: {type: string}
        title: {type: string, minLength: 1, maxLength: 255}
        description: {type: string}
        riskSourceGuidance: {type: string}
        causeGuidance: {type: string}
        consequenceGuidance: {type: string}
        subjectGuidance: {type: string}
        controlGuidance: {type: string}
        monitoringGuidance: {type: string}
    CatalogReference:
      type: object
      required: [type, value]
      properties:
        type: {type: string, maxLength: 32}
        value: {type: string, maxLength: 255}
    CatalogVersionReference:
      type: object
      required: [stableUuid, version]
      properties:
        stableUuid: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
    CatalogSuggestion:
      type: object
      required: [type, referenceType, referenceValue]
      properties:
        type: {type: string, maxLength: 32}
        referenceType: {type: string, maxLength: 32}
        referenceValue: {type: string, maxLength: 255}
        guidance: {type: string}
    ProbeStatus:
      type: object
      required: [status, service, version, enabled]
      properties:
        status:
          type: string
          enum: [ok, ready, not_ready]
        service:
          type: string
          enum: [scenario]
        version:
          type: string
          enum: [v1]
        enabled:
          type: boolean
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code:
              type: string
            message:
              type: string
            correlationId:
              type: string
    Page:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    ScenarioIdentifier:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        anrId:
          type: integer
          minimum: 1
          description: Legacy numeric ANR identifier where an ANR scope is needed.
    ScenarioAnalysis:
      type: object
      required: [uuid, anrId, lifecycle, languageCode, revision, createdAt, updatedAt]
      properties:
        uuid: {type: string, format: uuid}
        anrId: {type: integer, minimum: 1}
        lifecycle: {type: string, enum: [draft, active, monitored, closed, archived]}
        ownerId: {type: integer, minimum: 1, nullable: true}
        analysisIdentity:
          type: object
          properties:
            title: {type: string}
            description: {type: string}
            languageCode: {type: string}
            ownerId: {type: integer, minimum: 1, nullable: true}
        languageCode: {type: string}
        nextReviewAt: {type: string, format: date-time, nullable: true}
        riskAnalysisContext: {type: string, maxLength: 65535, nullable: true}
        trendsSummary: {type: string, maxLength: 65535, nullable: true}
        managementOrganisation: {type: string, maxLength: 65535, nullable: true}
        criteriaLockedAt: {type: string, format: date-time, nullable: true}
        criteriaLockedBy: {type: integer, minimum: 1, nullable: true}
        sourceAnrId: {type: integer, minimum: 1, nullable: true}
        revision: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ScenarioAnalysisCreate:
      type: object
      additionalProperties: false
      required: [languageCode]
      properties:
        languageCode: {type: string, pattern: '^[a-z]{2,3}(?:-[A-Z]{2})?$'}
        sourceAnrId: {type: integer, minimum: 1}
    RiskScenarioPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties: {items: {type: array, items: {$ref: '#/components/schemas/RiskScenario'}}}
    RiskScenarioReference:
      type: object
      required: [value, label, type, available]
      properties:
        value: {type: string}
        label: {type: string}
        group: {type: string}
        type: {type: string}
        available: {type: boolean}
        importance: {type: integer, minimum: 0, maximum: 3, description: Recommendation importance when the reference is a recommendation.}
        position: {type: integer, minimum: 0, description: Recommendation plan position when the reference is a recommendation.}
    RiskScenarioReferencePage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/RiskScenarioReference'}}
            availability: {type: string, enum: [available, unavailable]}
            message: {type: string}
    ContextualRiskSourceWrite:
      type: object
      additionalProperties: false
      required: [kind, label]
      properties:
        kind: {type: string, enum: [risk-source]}
        label: {type: string, minLength: 1, maxLength: 255}
    ScenarioInterestedPartyReferenceWrite:
      type: object
      additionalProperties: false
      required: [interestedPartyId]
      properties:
        interestedPartyId: {type: integer, minimum: 1}
    ScenarioInterestedPartyReference:
      type: object
      required: [interestedPartyId, stakeholder, requirement, linked]
      properties:
        interestedPartyId: {type: integer, minimum: 1}
        stakeholder: {type: string}
        requirement: {type: string}
        linked: {type: boolean}
        linkUuid: {type: string, format: uuid, nullable: true}
        referenceSnapshot:
          type: object
          nullable: true
          properties:
            stakeholder: {type: string}
            requirement: {type: string}
            sourceScope: {type: string}
    ScenarioInterestedPartyReferencePage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/ScenarioInterestedPartyReference'}}
            analysisRevision: {type: integer, minimum: 1}
    RiskScenario:
      type: object
      required: [uuid, anrId, title, revision, createdAt, updatedAt]
      properties:
        uuid: {type: string, format: uuid}
        anrId: {type: integer, minimum: 1}
        title: {type: string, maxLength: 255}
        sourceSnapshotUuid: {type: string, format: uuid, nullable: true}
        sourceInstanceRecordUuid: {type: string, format: uuid, nullable: true}
        description: {type: string, nullable: true}
        summaryAddendum: {type: string, nullable: true}
        riskSource: {$ref: '#/components/schemas/RiskScenarioRecord', nullable: true}
        cause: {$ref: '#/components/schemas/RiskScenarioRecord', nullable: true}
        events: {type: array, items: {$ref: '#/components/schemas/RiskScenarioNode'}}
        consequences: {type: array, items: {$ref: '#/components/schemas/RiskScenarioNode'}}
        edges: {type: array, items: {$ref: '#/components/schemas/RiskScenarioRelation'}}
        eventConsequences: {type: array, items: {$ref: '#/components/schemas/RiskScenarioRelation'}}
        subjectLinks: {type: array, items: {$ref: '#/components/schemas/RiskScenarioRelation'}}
        controlLinks: {type: array, items: {$ref: '#/components/schemas/RiskScenarioRelation'}}
        revision: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    RiskScenarioStatus:
      type: object
      required: [uuid, revision]
      properties:
        uuid: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
    RiskScenarioWrite:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 255}
        sourceSnapshotUuid: {type: string, format: uuid, nullable: true}
        sourceInstanceRecordUuid: {type: string, format: uuid, nullable: true}
        description: {type: string, maxLength: 65535}
        summaryAddendum: {type: string, maxLength: 65535}
    RiskScenarioUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: {type: string, minLength: 1, maxLength: 255}
        sourceSnapshotUuid: {type: string, format: uuid, nullable: true}
        sourceInstanceRecordUuid: {type: string, format: uuid, nullable: true}
        description: {type: string, maxLength: 65535, nullable: true}
        summaryAddendum: {type: string, maxLength: 65535, nullable: true}
    RiskScenarioRecord:
      type: object
      required: [uuid, title, revision]
      properties:
        uuid: {type: string, format: uuid}
        title: {type: string, maxLength: 255}
        description: {type: string, nullable: true}
        legacyRiskSourceId: {type: string, nullable: true}
        referenceSnapshot:
          type: object
          nullable: true
          properties:
            kind: {type: string}
            identity: {type: string}
            label: {type: string}
            sourceScope: {type: string}
        threatReferenceUuid: {type: string, format: uuid, nullable: true}
        threatReferenceSnapshot:
          type: object
          nullable: true
          properties:
            kind: {type: string}
            identity: {type: string}
            label: {type: string}
            sourceScope: {type: string}
        vulnerabilityReferenceUuid: {type: string, format: uuid, nullable: true}
        vulnerabilityReferenceSnapshot:
          type: object
          nullable: true
          properties:
            kind: {type: string}
            identity: {type: string}
            label: {type: string}
            sourceScope: {type: string}
        revision: {type: integer, minimum: 1}
        riskScenarioRevision: {type: integer, minimum: 1}
    RiskSourceWrite:
      type: object
      additionalProperties: false
      required: [legacyRiskSourceId]
      properties:
        legacyRiskSourceId: {type: string, minLength: 1, maxLength: 36}
